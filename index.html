<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FlowAI Studio</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#f5edff;
  background:
    radial-gradient(circle at 15% 0%,#6410a8 0,transparent 30%),
    radial-gradient(circle at 100% 30%,#32005e 0,transparent 35%),
    #0b0714;
  min-height:100vh;
}

button,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

button:disabled{
  cursor:not-allowed;
  opacity:.55;
}

/* TOP */

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:24px 26px 18px;
  max-width:1000px;
  margin:auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:16px;
}

.logo{
  width:70px;
  height:70px;
  border-radius:22px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  background:linear-gradient(135deg,#9b24ff,#d82be9);
}

.brand h1{
  margin:0;
  font-size:31px;
}

.brand p{
  margin:3px 0;
  color:#c38cff;
  font-size:20px;
}

.userArea{
  display:flex;
  align-items:center;
  gap:8px;
}

.credits{
  padding:13px 22px;
  border:1px solid #a83aff88;
  border-radius:30px;
  background:#241035;
  font-weight:bold;
}

.userName{
  color:#d7b6ff;
  font-weight:bold;
}

.logout{
  border:0;
  color:#fff;
  background:#5b1930;
  padding:12px 16px;
  border-radius:22px;
  font-weight:bold;
}

/* MAIN */

.wrap{
  max-width:1000px;
  margin:auto;
  padding:10px 25px 50px;
}

.card{
  border:1px solid #3d254f;
  border-radius:30px;
  background:#100b1b;
  padding:32px;
  box-shadow:0 20px 70px #0005;
}

.create{
  display:flex;
  align-items:center;
  gap:18px;
  margin-bottom:28px;
}

.magic{
  width:90px;
  height:90px;
  border-radius:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  background:linear-gradient(135deg,#8d27ff,#d72ae8);
}

h2{
  font-size:38px;
  margin:0;
}

.sub{
  color:#9c91a9;
  font-size:23px;
  margin-top:4px;
}

/* MODE */

.tabs{
  display:flex;
  background:#171321;
  border-radius:24px;
  padding:6px;
  margin-bottom:35px;
}

.tab{
  flex:1;
  border:0;
  background:transparent;
  color:#aaa0b7;
  padding:19px;
  border-radius:19px;
  font-size:23px;
  font-weight:bold;
}

.tab.active{
  color:white;
  background:linear-gradient(100deg,#7829dc,#d027d4);
}

/* PROMPT */

.label{
  color:#aaa0b8;
  font-weight:bold;
  letter-spacing:1px;
  font-size:18px;
  margin:22px 0 13px;
}

textarea{
  width:100%;
  height:220px;
  resize:none;
  background:#0d0915;
  color:white;
  border:1px solid #33253e;
  border-radius:25px;
  padding:25px;
  font-size:21px;
  outline:none;
}

textarea:focus{
  border-color:#b72aff;
}

.counter{
  text-align:right;
  color:#777080;
  margin-top:-35px;
  margin-right:20px;
}

/* IDEAS */

.ideas{
  display:flex;
  gap:12px;
  margin:28px 0;
  flex-wrap:wrap;
}

.idea{
  border:1px solid #33253f;
  background:#110d19;
  color:#d9d0df;
  border-radius:25px;
  padding:14px 22px;
  font-weight:bold;
}

/* OPTIONS */

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.option{
  border:1px solid #33253f;
  background:#110d19;
  color:#d9d0df;
  border-radius:25px;
  padding:20px;
  font-weight:bold;
  text-align:left;
}

.option strong{
  display:block;
  font-size:23px;
  color:#eee;
}

.option span{
  color:#94899d;
  font-size:17px;
}

.option.selected{
  border-color:#c02cff;
  background:#25123b;
  box-shadow:0 0 20px #b72aff22;
}

/* DURATION */

#durationSection{
  display:block;
}

.duration{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.duration button{
  border:1px solid #33253f;
  background:#110d19;
  color:#c8bfce;
  padding:18px;
  border-radius:18px;
  font-weight:bold;
}

.duration button.selected{
  background:linear-gradient(100deg,#7829dc,#c827d6);
  color:white;
  border-color:#c02cff;
}

/* GENERATE */

.generate{
  width:100%;
  margin-top:30px;
  padding:20px;
  border:0;
  border-radius:22px;
  color:white;
  font-size:22px;
  font-weight:bold;
  background:linear-gradient(100deg,#7928dc,#d128d7);
}

.generate:hover{
  filter:brightness(1.1);
}

/* STATUS */

.status{
  display:none;
  margin-top:20px;
  padding:18px;
  border-radius:18px;
  background:#181020;
  border:1px solid #432650;
  text-align:center;
}

/* OUTPUT */

.output{
  margin-top:22px;
}

.output video,
.output img{
  width:100%;
  display:block;
  border-radius:18px;
}

.download{
  display:inline-block;
  margin-top:12px;
  color:#d66aff;
  text-decoration:none;
  font-weight:bold;
}

/* HISTORY */

.history{
  margin-top:25px;
}

.item{
  padding:15px;
  border:1px solid #30203b;
  border-radius:16px;
  margin-top:10px;
  color:#a99faf;
  line-height:1.5;
  word-break:break-word;
}

.empty{
  text-align:center;
  padding:25px;
  color:#746b7d;
  border:1px dashed #34253e;
  border-radius:16px;
}

/* LOADING */

#loading{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#0b0714;
  color:#d7b6ff;
  font-size:18px;
  z-index:9999;
}

/* MOBILE */

@media(max-width:600px){

  .top{
    padding:18px 14px 10px;
  }

  .brand{
    gap:10px;
  }

  .brand h1{
    font-size:25px;
  }

  .brand p{
    font-size:16px;
  }

  .logo{
    width:58px;
    height:58px;
    font-size:32px;
  }

  .credits{
    font-size:12px;
    padding:9px 10px;
  }

  .userName{
    display:none;
  }

  .logout{
    padding:9px 11px;
    font-size:12px;
  }

  .wrap{
    padding:8px 12px 35px;
  }

  .card{
    padding:20px 15px;
    border-radius:23px;
  }

  .magic{
    width:68px;
    height:68px;
    font-size:33px;
  }

  h2{
    font-size:30px;
  }

  .sub{
    font-size:17px;
  }

  .tab{
    font-size:17px;
    padding:15px 8px;
  }

  textarea{
    height:190px;
    font-size:17px;
    padding:20px;
  }

  .grid2{
    grid-template-columns:1fr;
  }

  .duration{
    grid-template-columns:repeat(3,1fr);
  }

  .duration button{
    padding:15px 5px;
  }
}
</style>
</head>

<body>

<div id="loading">
  Checking login...
</div>


<header class="top">

  <div class="brand">

    <div class="logo">
      ✦
    </div>

    <div>
      <h1>FlowAI</h1>
      <p>Studio</p>
    </div>

  </div>


  <div class="userArea">

    <span class="credits">
      ⚡ <span id="credits">50</span> credits
    </span>

    <span
      class="userName"
      id="userName">
    </span>

    <button
      class="logout"
      id="logoutBtn">
      Logout
    </button>

  </div>

</header>


<main class="wrap">

<section class="card">


  <div class="create">

    <div class="magic">
      🪄
    </div>

    <div>

      <h2>Create</h2>

      <div class="sub">
        Describe your vision
      </div>

    </div>

  </div>


  <!-- VIDEO / IMAGE -->

  <div class="tabs">

    <button
      class="tab active"
      id="videoTab">

      🎬 Video

    </button>


    <button
      class="tab"
      id="imageTab">

      🖼️ Image

    </button>

  </div>


  <!-- PROMPT -->

  <div class="label">
    PROMPT
  </div>


  <textarea
    id="prompt"
    maxlength="500"
    placeholder="A cinematic shot of...">
  </textarea>


  <div class="counter">
    <span id="count">0</span>/500
  </div>


  <!-- IDEAS -->

  <div class="ideas">

    <button
      class="idea"
      data-idea="1">
      ✦ Idea 1
    </button>

    <button
      class="idea"
      data-idea="2">
      ✦ Idea 2
    </button>

    <button
      class="idea"
      data-idea="3">
      ✦ Idea 3
    </button>

  </div>


  <!-- ASPECT -->

  <div class="label">
    ASPECT RATIO
  </div>


  <div class="grid2">

    <button
      class="option selected"
      id="r169">

      <strong>
        ▭ 16:9
      </strong>

      <span>
        Landscape
      </span>

    </button>


    <button
      class="option"
      id="r916">

      <strong>
        ▯ 9:16
      </strong>

      <span>
        Portrait
      </span>

    </button>

  </div>


  <!-- VIDEO DURATION -->

  <div id="durationSection">

    <div class="label">
      DURATION
    </div>


    <div class="duration">

      <button id="d5">
        5s
        <br>
        <small>5 Credits</small>
      </button>


      <button
        id="d10"
        class="selected">

        10s
        <br>
        <small>10 Credits</small>

      </button>


      <button id="d15">

        15s
        <br>
        <small>15 Credits</small>

      </button>

    </div>

  </div>


  <!-- GENERATE -->

  <button
    class="generate"
    id="generateBtn">

    ⚡ Generate Video

  </button>


  <div
    class="status"
    id="status">
  </div>


  <!-- OUTPUT -->

  <div
    class="output"
    id="output">
  </div>


  <!-- HISTORY -->

  <div class="history">

    <h3>
      🕘 Recent Generations
    </h3>

    <div id="historyList">

      <div class="empty">
        No generations yet
      </div>

    </div>

  </div>


</section>

</main>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>


<script>

const firebaseConfig = {

  apiKey:
    "AIzaSyBp_2OzwhX39EP6GIYpSR6WbFBqHNGKwqY",

  authDomain:
    "flowai-studio.firebaseapp.com",

  projectId:
    "flowai-studio",

  storageBucket:
    "flowai-studio.firebasestorage.app",

  messagingSenderId:
    "990645093332",

  appId:
    "1:990645093332:web:27b88ffc3ee92d8b248c41",

  measurementId:
    "G-X3Z5XL1QLK"

};


firebase.initializeApp(
  firebaseConfig
);


const auth =
  firebase.auth();


/* =========================
   STATE
========================= */

let mode = "video";

let selectedAspect = "16:9";

let selectedDuration = 10;


/*
  Temporary frontend display.

  IMPORTANT:
  Real secure credits will
  later be controlled by Firebase
  / backend.
*/

let credits = 50;


/* =========================
   ELEMENTS
========================= */

const loading =
  document.getElementById(
    "loading"
  );

const userName =
  document.getElementById(
    "userName"
  );

const creditsEl =
  document.getElementById(
    "credits"
  );

const promptEl =
  document.getElementById(
    "prompt"
  );

const countEl =
  document.getElementById(
    "count"
  );

const statusEl =
  document.getElementById(
    "status"
  );

const historyEl =
  document.getElementById(
    "historyList"
  );

const outputEl =
  document.getElementById(
    "output"
  );

const generateBtn =
  document.getElementById(
    "generateBtn"
  );


/* =========================
   MODE
========================= */

function setMode(newMode){

  mode = newMode;


  const videoTab =
    document.getElementById(
      "videoTab"
    );

  const imageTab =
    document.getElementById(
      "imageTab"
    );


  videoTab.classList.toggle(
    "active",
    mode === "video"
  );


  imageTab.classList.toggle(
    "active",
    mode === "image"
  );


  const durationSection =
    document.getElementById(
      "durationSection"
    );


  if(mode === "video"){

    durationSection.style.display =
      "block";

    generateBtn.textContent =
      "⚡ Generate Video";

  }else{

    durationSection.style.display =
      "none";

    generateBtn.textContent =
      "🖼️ Generate Image";

  }

}


/* =========================
   COUNTER
========================= */

function countText(){

  countEl.textContent =
    promptEl.value.length;

}


/* =========================
   IDEAS
========================= */

function idea(n){

  const ideas = [

    "A cinematic drone shot over a futuristic city at sunset, ultra realistic, dramatic lighting",

    "A mysterious ancient temple hidden inside a beautiful jungle, cinematic atmosphere, realistic details",

    "A magical night sky above the mountains with glowing stars, epic cinematic scene, ultra realistic"

  ];


  promptEl.value =
    ideas[n - 1] || "";


  countText();

}


/* =========================
   ASPECT
========================= */

function setAspect(value){

  selectedAspect =
    value;


  document
    .getElementById("r169")
    .classList.toggle(
      "selected",
      value === "16:9"
    );


  document
    .getElementById("r916")
    .classList.toggle(
      "selected",
      value === "9:16"
    );

}


/* =========================
   DURATION
========================= */

function setDuration(value){

  selectedDuration =
    value;


  [5,10,15].forEach(n => {

    document
      .getElementById("d" + n)
      .classList.toggle(
        "selected",
        n === value
      );

  });

}


/* =========================
   STATUS
========================= */

function showStatus(text){

  statusEl.style.display =
    "block";

  statusEl.textContent =
    text;

}


/* =========================
   CREDIT COST
========================= */

function getVideoCost(){

  if(selectedDuration === 5){

    return 5;

  }

  if(selectedDuration === 10){

    return 10;

  }

  if(selectedDuration === 15){

    return 15;

  }

  return 10;

}


/* =========================
   GENERATE
========================= */

async function generate(){

  const prompt =
    promptEl.value.trim();


  if(!prompt){

    showStatus(
      "⚠️ Please enter a prompt first."
    );

    return;

  }


  /*
    IMAGE = FREE
  */

  const cost =
    mode === "image"
      ? 0
      : getVideoCost();


  /*
    Only VIDEO checks credits.
  */

  if(
    mode === "video" &&
    credits < cost
  ){

    showStatus(
      "❌ Not enough credits. " +
      "You need " +
      cost +
      " credits."
    );

    return;

  }


  /*
    Deduct only VIDEO credits.
  */

  if(mode === "video"){

    credits -= cost;

    creditsEl.textContent =
      credits;

  }


  generateBtn.disabled =
    true;


  if(mode === "video"){

    showStatus(
      "⏳ Creating your " +
      selectedDuration +
      " second video..."
    );

  }else{

    showStatus(
      "⏳ Creating your FREE image..."
    );

  }


  outputEl.innerHTML =
    "";


  try{

    const response =
      await fetch(
        "/api/generate",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              prompt:prompt,

              mode:mode,

              /*
                IMPORTANT:
                Backend expects aspect
              */

              aspect:
                selectedAspect,

              /*
                Video duration
              */

              duration:
                selectedDuration

            })

        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Generation failed"
      );

    }


    if(!data.url){

      throw new Error(
        "No output received."
      );

    }


    /* =====================
       IMAGE RESULT
    ===================== */

    if(data.type === "image"){

      showStatus(
        "✅ Image generated successfully — FREE"
      );


      const img =
        document.createElement(
          "img"
        );


      img.src =
        data.url;


      img.alt =
        prompt;


      outputEl.appendChild(
        img
      );


      const download =
        document.createElement(
          "a"
        );


      download.className =
        "download";


      download.href =
        data.url;


      download.target =
        "_blank";


      download.textContent =
        "⬇ Download Image";


      outputEl.appendChild(
        download
      );

    }


    /* =====================
       VIDEO RESULT
    ===================== */

    else if(data.type === "video"){

      showStatus(
        "✅ " +
        selectedDuration +
        " second video generated successfully."
      );


      const video =
        document.createElement(
          "video"
        );


      video.src =
        data.url;


      video.controls =
        true;


      video.playsInline =
        true;


      outputEl.appendChild(
        video
      );


      const download =
        document.createElement(
          "a"
        );


      download.className =
        "download";


      download.href =
        data.url;


      download.target =
        "_blank";


      download.textContent =
        "⬇ Download Video";


      outputEl.appendChild(
        download
      );

    }


    /* =====================
       HISTORY
    ===================== */

    historyEl
      .querySelector(".empty")
      ?.remove();


    const item =
      document.createElement(
        "div"
      );


    item.className =
      "item";


    item.innerHTML =
      mode === "video"

      ? "🎬 Video — " +
        selectedDuration +
        "s — " +
        cost +
        " credits"

      : "🖼️ Image — FREE";


    historyEl.prepend(
      item
    );


  }catch(error){

    console.error(
      "Generation error:",
      error
    );


    /*
      Refund VIDEO credits
      if generation fails.
    */

    if(mode === "video"){

      credits += cost;

      creditsEl.textContent =
        credits;

    }


    showStatus(
      "❌ Generation failed: " +
      error.message
    );

  }


  generateBtn.disabled =
    false;


  if(mode === "video"){

    generateBtn.textContent =
      "⚡ Generate Video";

  }else{

    generateBtn.textContent =
      "🖼️ Generate Image";

  }

}


/* =========================
   EVENTS
========================= */

document
  .getElementById("videoTab")
  .onclick =
  () => setMode("video");


document
  .getElementById("imageTab")
  .onclick =
  () => setMode("image");


document
  .getElementById("r169")
  .onclick =
  () => setAspect("16:9");


document
  .getElementById("r916")
  .onclick =
  () => setAspect("9:16");


document
  .getElementById("d5")
  .onclick =
  () => setDuration(5);


document
  .getElementById("d10")
  .onclick =
  () => setDuration(10);


document
  .getElementById("d15")
  .onclick =
  () => setDuration(15);


document
  .querySelectorAll(".idea")
  .forEach(btn => {

    btn.onclick =
      () =>
        idea(
          Number(
            btn.dataset.idea
          )
        );

  });


promptEl.addEventListener(
  "input",
  countText
);


generateBtn.onclick =
  generate;


/* =========================
   LOGOUT
========================= */

document
  .getElementById("logoutBtn")
  .onclick =
  async () => {

    try{

      await auth.signOut();

      window.location.replace(
        "/login.html"
      );

    }catch(error){

      console.error(error);

      window.location.replace(
        "/login.html"
      );

    }

  };


/* =========================
   AUTH GUARD
========================= */

auth.onAuthStateChanged(
  user => {

    if(user){

      const name =
        user.displayName ||
        (
          user.email
            ? user.email.split("@")[0]
            : "User"
        );


      userName.textContent =
        "👤 " + name;


      loading.style.display =
        "none";

    }else{

      window.location.replace(
        "/login.html"
      );

    }

  }
);


/* =========================
   INITIAL
========================= */

setMode("video");

setAspect("16:9");

setDuration(10);

countText();

</script>

</body>
</html>
