<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowAI Studio</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#09090d;
    color:#fff;
    min-height:100vh;
}

.topbar{
    height:58px;
    background:#111116;
    border-bottom:1px solid #24242d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
}

.logo{
    color:#9b5cff;
    font-size:16px;
    font-weight:bold;
}

.user-area{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:11px;
}

.credits{
    background:#24232d;
    padding:7px 12px;
    border-radius:20px;
    color:#fff;
}

.logout{
    border:0;
    background:#ef4444;
    color:#fff;
    padding:7px 12px;
    border-radius:6px;
    font-size:11px;
}

.layout{
    display:flex;
    min-height:calc(100vh - 58px);
}

.sidebar{
    width:52px;
    background:#111116;
    border-right:1px solid #24242d;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:10px;
    gap:8px;
}

.side-btn{
    width:38px;
    height:38px;
    border:0;
    background:transparent;
    color:#aaa;
    border-radius:8px;
    font-size:19px;
}

.side-btn.active{
    background:#7c3aed;
    color:#fff;
}

.main{
    flex:1;
    padding:18px;
    max-width:1100px;
    margin:auto;
}

.back{
    border:1px solid #292934;
    background:#121218;
    color:#ddd;
    padding:8px 14px;
    border-radius:7px;
    font-size:12px;
    cursor:pointer;
    margin-bottom:18px;
}

.title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:5px;
}

.subtitle{
    color:#777;
    font-size:13px;
    margin-bottom:18px;
}

.editor{
    border:1px solid #272731;
    background:#101015;
    border-radius:12px;
    overflow:hidden;
}

.prompt-area{
    padding:18px;
}

label{
    display:block;
    color:#aaa;
    font-size:13px;
    margin-bottom:8px;
}

textarea{
    width:100%;
    min-height:150px;
    resize:vertical;
    background:#0b0b10;
    border:1px solid #30303a;
    color:#fff;
    border-radius:9px;
    padding:15px;
    font-size:14px;
    line-height:1.5;
    outline:none;
}

textarea:focus{
    border-color:#8b5cf6;
    box-shadow:0 0 0 2px rgba(139,92,246,.15);
}

.controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:15px 18px;
    border-top:1px solid #25252e;
    flex-wrap:wrap;
}

.modes{
    display:flex;
    gap:8px;
}

.mode{
    border:1px solid #30303a;
    background:#19191f;
    color:#aaa;
    padding:9px 15px;
    border-radius:20px;
    cursor:pointer;
    font-size:12px;
}

.mode.active{
    background:#7c3aed;
    border-color:#8b5cf6;
    color:white;
}

.generate{
    border:0;
    background:linear-gradient(135deg,#7c3aed,#9333ea);
    color:#fff;
    padding:11px 24px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    font-size:13px;
}

.generate:hover{
    opacity:.9;
}

.generate:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.result{
    margin-top:18px;
    border:1px solid #272731;
    background:#101015;
    border-radius:12px;
    min-height:180px;
    padding:18px;
}

.result-title{
    font-size:14px;
    font-weight:bold;
    margin-bottom:12px;
}

.placeholder{
    min-height:130px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#666;
    font-size:13px;
}

.loading{
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    min-height:130px;
    color:#aaa;
}

.spinner{
    width:32px;
    height:32px;
    border:3px solid #292932;
    border-top-color:#8b5cf6;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.error{
    display:none;
    background:#351719;
    border:1px solid #7f1d1d;
    color:#fca5a5;
    padding:12px;
    border-radius:8px;
    font-size:13px;
}

.result img,
.result video{
    width:100%;
    max-height:600px;
    object-fit:contain;
    border-radius:8px;
    background:#050507;
}

.download{
    display:inline-block;
    margin-top:12px;
    background:#27272f;
    color:white;
    padding:9px 15px;
    border-radius:7px;
    text-decoration:none;
    font-size:12px;
}

@media(max-width:600px){

    .topbar{
        padding:0 10px;
    }

    .user-area{
        gap:5px;
    }

    .user-email{
        display:none;
    }

    .sidebar{
        width:48px;
    }

    .main{
        padding:14px 10px;
    }

    .title{
        font-size:19px;
    }

    .controls{
        flex-direction:column;
        align-items:stretch;
    }

    .modes{
        width:100%;
    }

    .mode{
        flex:1;
        text-align:center;
    }

    .generate{
        width:100%;
    }

    textarea{
        min-height:170px;
    }
}
</style>
</head>

<body>

<header class="topbar">
    <div class="logo">FlowAI Studio</div>

    <div class="user-area">
        <span class="user-email" id="userEmail">User</span>
        <span class="credits">⚡ <span id="credits">50</span> Credits</span>
        <button class="logout" onclick="logout()">Logout</button>
    </div>
</header>

<div class="layout">

    <aside class="sidebar">
        <button class="side-btn active" onclick="goHome()">🏠</button>
        <button class="side-btn">✨</button>
        <button class="side-btn">🔍</button>
        <button class="side-btn">⚙️</button>
    </aside>

    <main class="main">

        <button class="back" onclick="goHome()">← Back</button>

        <h1 class="title">Create Cinematic AI Media</h1>

        <p class="subtitle">
            Describe what you want to create and generate high-quality AI media.
        </p>

        <section class="editor">

            <div class="prompt-area">

                <label for="prompt">
                    Describe your image or video
                </label>

                <textarea
                    id="prompt"
                    placeholder="Example: A cinematic shot of a futuristic city at night, neon lights, rain, realistic, 4K..."
                ></textarea>

            </div>

            <div class="controls">

                <div class="modes">

                    <button
                        class="mode active"
                        id="imageMode"
                        onclick="setMode('image')">
                        🖼️ Image Mode
                    </button>

                    <button
                        class="mode"
                        id="videoMode"
                        onclick="setMode('video')">
                        🎬 Video Mode
                    </button>

                </div>

                <button
                    class="generate"
                    id="generateBtn"
                    onclick="generateMedia()">
                    ✨ Generate
                </button>

            </div>

        </section>

        <section class="result">

            <div class="result-title">
                Generated Result
            </div>

            <div class="placeholder" id="placeholder">
                Type a description above and tap Generate.
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div id="loadingText">Generating your creation...</div>
            </div>

            <div class="error" id="error"></div>

            <div id="output"></div>

        </section>

    </main>

</div>

<script>

let currentMode = "image";

function setMode(mode){

    currentMode = mode;

    document
        .getElementById("imageMode")
        .classList.toggle("active", mode === "image");

    document
        .getElementById("videoMode")
        .classList.toggle("active", mode === "video");

    const prompt = document.getElementById("prompt");

    if(mode === "video"){
        prompt.placeholder =
        "Example: A cinematic drone shot flying over snowy mountains at sunrise, realistic, smooth camera movement...";
    }else{
        prompt.placeholder =
        "Example: A cinematic shot of a futuristic city at night, neon lights, rain, realistic, 4K...";
    }
}

async function generateMedia(){

    const prompt =
        document.getElementById("prompt").value.trim();

    const button =
        document.getElementById("generateBtn");

    const placeholder =
        document.getElementById("placeholder");

    const loading =
        document.getElementById("loading");

    const error =
        document.getElementById("error");

    const output =
        document.getElementById("output");

    if(!prompt){

        error.style.display = "block";
        error.innerText =
        "Please enter a description first.";

        return;
    }

    error.style.display = "none";
    output.innerHTML = "";
    placeholder.style.display = "none";
    loading.style.display = "flex";

    button.disabled = true;

    document.getElementById("loadingText").innerText =
        currentMode === "video"
        ? "Generating your video..."
        : "Generating your image...";

    try{

        /*
         * Your backend API endpoint.
         * The server should receive:
         * {
         *   prompt: "...",
         *   mode: "image" / "video"
         * }
         */

        const response = await fetch("/api/generate", {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                prompt:prompt,
                mode:currentMode
            })

        });

        const data = await response.json();

        if(!response.ok){
            throw new Error(
                data.error || "Generation failed."
            );
        }

        loading.style.display = "none";

        /*
         * Supported backend responses:
         *
         * Image:
         * { "url": "https://..." }
         *
         * Video:
         * { "url": "https://..." }
         */

        if(!data.url){

            throw new Error(
                "No generated media URL was returned."
            );
        }

        if(currentMode === "image"){

            output.innerHTML = `
                <img
                    src="${data.url}"
                    alt="Generated AI Image"
                >

                <a
                    class="download"
                    href="${data.url}"
                    target="_blank"
                    download
                >
                    ⬇ Download Image
                </a>
            `;

        }else{

            output.innerHTML = `
                <video
                    src="${data.url}"
                    controls
                    autoplay
                    loop
                ></video>

                <a
                    class="download"
                    href="${data.url}"
                    target="_blank"
                    download
                >
                    ⬇ Download Video
                </a>
            `;
        }

    }catch(err){

        loading.style.display = "none";

        error.style.display = "block";

        error.innerText =
            err.message ||
            "Something went wrong. Please try again.";

    }finally{

        button.disabled = false;

    }
}

function goHome(){
    window.location.href = "/";
}

function logout(){

    localStorage.removeItem("user");
    localStorage.removeItem("token");

    window.location.href = "/login";
}

document.addEventListener("DOMContentLoaded",function(){

    const user =
        localStorage.getItem("user");

    if(user){
        document.getElementById("userEmail").innerText = user;
    }

});

</script>

</body>
</html>
