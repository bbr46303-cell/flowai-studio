<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b0714">
<title>FlowAI Studio</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:#0b0714}
body{
font-family:Arial,Inter,sans-serif;color:#f7efff;
background:
radial-gradient(circle at 15% 0%,#6810ad 0,transparent 30%),
radial-gradient(circle at 100% 30%,#360061 0,transparent 35%),#0b0714
}
button,input,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

/* LOGIN */
.login-page{
min-height:100vh;display:flex;align-items:center;
justify-content:center;padding:15px
}
.login-card{
width:100%;max-width:520px;background:#100a1b;
border:1px solid #8b36bd;border-radius:30px;
padding:35px 25px;text-align:center;
box-shadow:0 0 70px #8c20d955
}
.big-logo{
width:115px;height:115px;margin:0 auto 22px;
border-radius:32px;display:flex;align-items:center;
justify-content:center;font-size:65px;
background:linear-gradient(135deg,#9b24ff,#d82be9)
}
.login-card h1{font-size:38px;margin:0}
.login-card p{color:#aaa0b0;font-size:18px;line-height:1.5}
.auth-tabs{
display:flex;background:#181321;padding:5px;
border-radius:17px;margin:22px 0
}
.auth-tab{
flex:1;padding:15px;border:0;background:transparent;
color:#aaa0b7;border-radius:13px;font-weight:bold
}
.auth-tab.active{
color:white;background:linear-gradient(100deg,#7928dc,#d128d7)
}
.auth-input{
width:100%;padding:16px;margin:6px 0;
border-radius:14px;border:1px solid #3b2948;
background:#0b0811;color:white;outline:none
}
.auth-input:focus{border-color:#bd2dff}
.main-btn,.google-btn{
width:100%;padding:16px;border:0;border-radius:14px;
margin-top:12px;font-weight:bold
}
.main-btn{
color:white;background:linear-gradient(100deg,#7928dc,#d128d7)
}
.google-btn{background:white;color:#222}
.auth-message{
min-height:24px;margin-top:15px;color:#ff86a8;
font-size:14px
}
.or{color:#777080;margin:17px 0}

/* HEADER */
.top{
display:flex;align-items:center;justify-content:space-between;
padding:20px 18px;max-width:900px;margin:auto;gap:10px
}
.brand{display:flex;align-items:center;gap:12px}
.logo{
width:62px;height:62px;border-radius:20px;
display:flex;align-items:center;justify-content:center;
font-size:34px;background:linear-gradient(135deg,#9b24ff,#d82be9);
box-shadow:0 0 35px #a626ff66
}
.brand h1{margin:0;font-size:29px}
.brand p{margin:2px 0;color:#c38cff;font-size:18px}
.user-area{
display:flex;align-items:center;gap:7px;
justify-content:flex-end;flex-wrap:wrap
}
.credits{
padding:10px 14px;border:1px solid #a83aff88;
border-radius:25px;background:#241035;font-weight:bold;
font-size:14px
}
.user-name{color:#d2a4ff;font-weight:bold}
.logout{
border:1px solid #753b91;background:#160d20;
color:#ddd;padding:9px 13px;border-radius:20px
}

/* CARD */
.wrap{max-width:900px;margin:auto;padding:8px 14px 40px}
.card{
border:1px solid #3d254f;border-radius:28px;
background:#100b1bdb;padding:25px 20px;
box-shadow:0 0 50px #6c0c9b20
}
.create{
display:flex;align-items:center;gap:14px;margin-bottom:25px
}
.magic{
width:75px;height:75px;border-radius:23px;
display:flex;align-items:center;justify-content:center;
font-size:38px;background:linear-gradient(135deg,#8d27ff,#d72ae8)
}
h2{font-size:34px;margin:0}
.sub{color:#9c91a9;font-size:19px}
.tabs{
display:flex;background:#171321;border-radius:22px;
padding:5px;margin-bottom:28px
}
.tab{
flex:1;border:0;background:transparent;color:#aaa0b7;
padding:16px;border-radius:17px;font-size:20px;font-weight:bold
}
.tab.active{
color:white;background:linear-gradient(100deg,#7829dc,#d027d4)
}
.label{
color:#aaa0b8;font-weight:bold;letter-spacing:1px;
font-size:17px;margin:20px 0 11px
}
textarea{
width:100%;height:190px;resize:none;
background:#0d0915;color:white;border:1px solid #33253e;
border-radius:23px;padding:20px;font-size:18px;outline:none
}
textarea:focus{border-color:#b22cff}
.counter{
text-align:right;color:#777080;margin-top:-32px;margin-right:17px
}
.ideas{
display:flex;gap:10px;margin:25px 0;flex-wrap:wrap
}
.idea,.option{
border:1px solid #33253f;background:#110d19;
color:#d9d0df;border-radius:23px;
padding:13px 19px;font-weight:bold
}
.grid2{
display:grid;grid-template-columns:1fr 1fr;gap:12px
}
.option{text-align:left;padding:18px}
.option strong{display:block;font-size:21px;color:#eee}
.option span{color:#94899d;font-size:16px}
.option.selected{
border-color:#c02cff;
background:linear-gradient(135deg,#25123b,#17101f)
}
.duration{
display:grid;grid-template-columns:repeat(3,1fr);gap:10px
}
.duration button{
border:1px solid #33253f;background:#110d19;
color:#c8bfce;padding:17px;border-radius:17px;
font-weight:bold
}
.duration button.selected{
background:linear-gradient(100deg,#7829dc,#c827d6);
color:white;border-color:#c52aff
}
.generate{
width:100%;margin-top:28px;padding:19px;
border:0;border-radius:20px;color:white;
font-size:21px;font-weight:bold;
background:linear-gradient(100deg,#7928dc,#d128d7);
box-shadow:0 10px 35px #a127d94d
}
.generate:disabled{opacity:.6;cursor:not-allowed}
.status{
display:none;margin-top:18px;padding:18px;
border-radius:18px;background:#181020;
border:1px solid #432650;text-align:center;
color:#d7c5e5;line-height:1.5
}
.video-result{
width:100%;margin-top:15px;border-radius:18px;
background:#000;max-height:600px
}
.download-btn{
display:inline-block;margin-top:14px;
padding:12px 18px;border-radius:15px;
background:#7928dc;color:white;text-decoration:none;
font-weight:bold
}
.history{margin-top:25px}
.history h3{font-size:22px}
.item{
padding:15px;border:1px solid #30203b;
border-radius:16px;margin-top:10px;
color:#a99faf;word-break:break-word
}

@media(max-width:600px){
.top{padding:16px 12px;align-items:flex-start}
.brand h1{font-size:25px}
.brand p{font-size:16px}
.logo{width:57px;height:57px}
.credits{font-size:12px;padding:8px 10px}
.user-name{font-size:12px}
.logout{font-size:12px;padding:7px 10px}
.card{padding:22px 16px}
.grid2{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- LOGIN -->
<section id="loginPage" class="login-page">
<div class="login-card">

<div class="big-logo">✦</div>

<h1>Welcome to FlowAI</h1>

<p>
Login या Sign Up करें और<br>
FlowAI Studio इस्तेमाल करें।
</p>

<div class="auth-tabs">
<button type="button" id="loginTab" class="auth-tab active">Login</button>
<button type="button" id="signupTab" class="auth-tab">Sign Up</button>
</div>

<input id="authName" class="auth-input"
placeholder="Your name"
style="display:none">

<input id="authEmail" class="auth-input"
type="email"
placeholder="Email address">

<input id="authPassword" class="auth-input"
type="password"
placeholder="Password">

<button type="button" id="authButton" class="main-btn">
Login
</button>

<div class="or">OR</div>

<button type="button" id="googleButton" class="google-btn">
🔵 Continue with Google
</button>

<div id="authMessage" class="auth-message"></div>

</div>
</section>

<!-- STUDIO -->
<section id="studioPage" style="display:none">

<header class="top">

<div class="brand">
<div class="logo">✦</div>
<div>
<h1>FlowAI</h1>
<p>Studio</p>
</div>
</div>

<div class="user-area">

<span class="credits">
⚡ <span id="credits">50</span> credits
</span>

<span class="user-name" id="userName">
👤 User
</span>

<button type="button" class="logout" id="logoutButton">
Logout
</button>

</div>
</header>

<main class="wrap">

<section class="card">

<div class="create">
<div class="magic">🪄</div>
<div>
<h2>Create</h2>
<div class="sub">Describe your vision</div>
</div>
</div>

<div class="tabs">
<button type="button" class="tab active" id="videoTab">
🎞️
