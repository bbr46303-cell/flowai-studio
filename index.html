<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  updateProfile,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBp_2OzwhX39EP6GIYpSR6WbFBqHNGKwqY",

  authDomain:
    "flowai-studio.firebaseapp.com",

  projectId:
    "flowai-studio",

  storageBucket:
    "flowai-studio.firebasestorage.app",

  messagingSenderId:
    "990645093332",

  appId:
    "1:990645093332:web:27b88ffc3ee92d8b248c41",

  measurementId:
    "G-X3Z5XL1QLK"

};


/* =========================
   INITIALIZE FIREBASE
========================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const googleProvider =
  new GoogleAuthProvider();


/* =========================
   VARIABLES
========================= */

let signupMode = false;
let currentMode = "image";


/* =========================
   ERROR MESSAGE
========================= */

function showAuthError(message){

  const box =
    document.getElementById("authError");

  if(!box) return;

  box.innerText = message;

  box.style.display = "block";
}


function hideAuthError(){

  const box =
    document.getElementById("authError");

  if(!box) return;

  box.style.display = "none";
}


/* =========================
   FIREBASE ERROR
========================= */

function firebaseError(error){

  switch(error.code){

    case "auth/invalid-credential":
      return "Email or password is incorrect.";

    case "auth/invalid-email":
      return "Please enter a valid email address.";

    case "auth/user-not-found":
      return "No account found with this email.";

    case "auth/wrong-password":
      return "Incorrect password.";

    case "auth/email-already-in-use":
      return "An account already exists with this email.";

    case "auth/weak-password":
      return "Password must be at least 6 characters.";

    case "auth/too-many-requests":
      return "Too many attempts. Please try again later.";

    case "auth/unauthorized-domain":
      return "This website domain is not authorized in Firebase.";

    case "auth/network-request-failed":
      return "Network error. Check your internet connection.";

    case "auth/popup-blocked":
      return "Google login was blocked by the browser.";

    case "auth/operation-not-allowed":
      return "This login method is not enabled in Firebase.";

    default:
      return error.message ||
        "Something went wrong. Please try again.";
  }

}


/* =========================
   SAVE USER
========================= */

function saveUser(user){

  if(!user) return;

  const userData = {

    uid:
      user.uid || "",

    name:
      user.displayName ||
      (user.email
        ? user.email.split("@")[0]
        : "User"),

    email:
      user.email || ""

  };


  localStorage.setItem(
    "flowai_user",
    JSON.stringify(userData)
  );

}


/* =========================
   GOOGLE LOGIN
========================= */

window.googleLogin =
  async function(){

    hideAuthError();

    const button =
      document.querySelector(
        ".google-btn"
      );

    if(button){

      button.disabled = true;

      button.innerText =
        "Connecting to Google...";

    }


    try{

      await signInWithRedirect(
        auth,
        googleProvider
      );

    }catch(error){

      console.error(
        "GOOGLE LOGIN ERROR:",
        error
      );

      showAuthError(
        firebaseError(error)
      );


      if(button){

        button.disabled = false;

        button.innerText =
          "🔵 Continue with Google";

      }

    }

  };


/* =========================
   GOOGLE REDIRECT RESULT
========================= */

getRedirectResult(auth)
  .then(function(result){

    if(
      result &&
      result.user
    ){

      saveUser(
        result.user
      );

      openApp(
        result.user
      );

    }

  })
  .catch(function(error){

    console.error(
      "REDIRECT ERROR:",
      error
    );

    showAuthError(
      firebaseError(error)
    );

  });


/* =========================
   EMAIL LOGIN / SIGNUP
========================= */

window.emailAuth =
  async function(){

    hideAuthError();


    const email =
      document
        .getElementById("emailInput")
        .value
        .trim();


    const password =
      document
        .getElementById("passwordInput")
        .value;


    const name =
      document
        .getElementById("nameInput")
        .value
        .trim();


    const button =
      document
        .getElementById("authButton");


    /* VALIDATION */

    if(!email){

      showAuthError(
        "Please enter your email address."
      );

      return;

    }


    if(!password){

      showAuthError(
        "Please enter your password."
      );

      return;

    }


    if(
      signupMode &&
      !name
    ){

      showAuthError(
        "Please enter your name."
      );

      return;

    }


    if(
      signupMode &&
      password.length < 6
    ){

      showAuthError(
        "Password must be at least 6 characters."
      );

      return;

    }


    button.disabled = true;

    button.innerText =
      signupMode
      ? "Creating account..."
      : "Logging in...";


    try{

      let user;


      /* =====================
         SIGN UP
      ===================== */

      if(signupMode){

        const result =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        user =
          result.user;


        await updateProfile(
          user,
          {
            displayName:
              name
          }
        );

      }


      /* =====================
         LOGIN
      ===================== */

      else{

        const result =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        user =
          result.user;

      }


      /* SAVE */

      saveUser(user);


      /* OPEN APP */

      openApp(user);


    }catch(error){

      console.error(
        "EMAIL AUTH ERROR:",
        error
      );

      showAuthError(
        firebaseError(error)
      );


      button.disabled = false;

      button.innerText =
        signupMode
        ? "Sign up"
        : "Login";

    }

  };


/* =========================
   SHOW SIGNUP
========================= */

window.showSignup =
  function(){

    signupMode = true;

    hideAuthError();


    document
      .getElementById("authTitle")
      .innerText =
      "Create your account";


    document
      .getElementById("authSubtitle")
      .innerText =
      "Join FlowAI Studio and start creating";


    document
      .getElementById("signupNameBox")
      .style.display =
      "block";


    document
      .getElementById("authButton")
      .innerText =
      "Sign up";


    document
      .getElementById("switchText")
      .innerHTML =
      'Already have an account? <span onclick="showLogin()">Login</span>';

  };


/* =========================
   SHOW LOGIN
========================= */

window.showLogin =
  function(){

    signupMode = false;

    hideAuthError();


    document
      .getElementById("authTitle")
      .innerText =
      "Welcome back";


    document
      .getElementById("authSubtitle")
      .innerText =
      "Sign in to continue to FlowAI Studio";


    document
      .getElementById("signupNameBox")
      .style.display =
      "none";


    document
      .getElementById("authButton")
      .innerText =
      "Login";


    document
      .getElementById("switchText")
      .innerHTML =
      'Don\'t have an account? <span onclick="showSignup()">Create account</span>';

  };


/* =========================
   OPEN APP
========================= */

function openApp(user){

  if(!user){

    return;

  }


  const authPage =
    document.getElementById(
      "authPage"
    );


  const appPage =
    document.getElementById(
      "app"
    );


  const userEmail =
    document.getElementById(
      "userEmail"
    );


  if(authPage){

    authPage.style.display =
      "none";

  }


  if(appPage){

    appPage.style.display =
      "block";

  }


  if(userEmail){

    userEmail.innerText =
      user.email || "User";

  }


  showDashboard();

}


/* =========================
   DASHBOARD
========================= */

window.showDashboard =
  function(){

    const dashboard =
      document.getElementById(
        "dashboard"
      );


    const studio =
      document.getElementById(
        "studio"
      );


    if(dashboard){

      dashboard.style.display =
        "block";

    }


    if(studio){

      studio.style.display =
        "none";

    }

  };


/* =========================
   NEW PROJECT
========================= */

window.newProject =
  function(){

    const dashboard =
      document.getElementById(
        "dashboard"
      );


    const studio =
      document.getElementById(
        "studio"
      );


    if(dashboard){

      dashboard.style.display =
        "none";

    }


    if(studio){

      studio.style.display =
        "block";

    }

  };


/* =========================
   MODE
========================= */

window.setMode =
  function(mode){

    currentMode =
      mode;


    const imageMode =
      document.getElementById(
        "imageMode"
      );


    const videoMode =
      document.getElementById(
        "videoMode"
      );


    if(imageMode){

      imageMode.classList.toggle(
        "active",
        mode === "image"
      );

    }


    if(videoMode){

      videoMode.classList.toggle(
        "active",
        mode === "video"
      );

    }

  };


/* =========================
   GENERATE MEDIA
========================= */

window.generateMedia =
  async function(){

    const prompt =
      document
        .getElementById("prompt")
        .value
        .trim();


    if(!prompt){

      alert(
        "Please enter a prompt."
      );

      return;

    }


    const placeholder =
      document.getElementById(
        "placeholder"
      );


    const output =
      document.getElementById(
        "output"
      );


    placeholder.innerText =
      currentMode === "video"
      ? "Generating your video..."
      : "Generating your image...";


    output.innerHTML = "";


    try{

      const response =
        await fetch(
          "/api/generate",
          {

            method:
              "POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                prompt:
                  prompt,

                mode:
                  currentMode

              })

          }
        );


      const data =
        await response.json();


      if(!response.ok){

        throw new Error(
          data.error ||
          "Generation failed"
        );

      }


      if(data.type === "image"){

        output.innerHTML = `

          <img
            src="${data.url}"
            style="
              width:100%;
              border-radius:10px;
              display:block;
            "
          >

          <br>

          <a
            href="${data.url}"
            target="_blank"
            style="color:white"
          >
            ⬇ Download Image
          </a>

        `;

      }


      if(data.type === "video"){

        output.innerHTML = `

          <video
            src="${data.url}"
            controls
            playsinline
            style="
              width:100%;
              border-radius:10px;
              display:block;
            "
          ></video>

          <br>

          <a
            href="${data.url}"
            target="_blank"
            style="color:white"
          >
            ⬇ Download Video
          </a>

        `;

      }


      placeholder.innerText =
        "Generation complete.";


    }catch(error){

      console.error(
        "GENERATION ERROR:",
        error
      );


      placeholder.innerText =
        "Generation failed: " +
        error.message;

    }

  };


/* =========================
   LOGOUT
========================= */

window.logout =
  async function(){

    try{

      await signOut(auth);

    }catch(error){

      console.error(
        "LOGOUT ERROR:",
        error
      );

    }


    localStorage.removeItem(
      "flowai_user"
    );


    location.reload();

  };


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  function(user){

    if(user){

      saveUser(user);

      openApp(user);

    }

  }
);

</script>
