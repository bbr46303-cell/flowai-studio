<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FlowAI Studio</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#f5edff;background:radial-gradient(circle at 15% 0%,#6410a8 0,transparent 30%),radial-gradient(circle at 100% 30%,#32005e 0,transparent 35%),#0b0714;min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.top{display:flex;align-items:center;justify-content:space-between;padding:24px 26px 18px;max-width:1000px;margin:auto}.brand{display:flex;align-items:center;gap:16px}.logo{width:70px;height:70px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:38px;background:linear-gradient(135deg,#9b24ff,#d82be9)}.brand h1{margin:0;font-size:31px}.brand p{margin:3px 0;color:#c38cff;font-size:20px}.userArea{display:flex;align-items:center;gap:8px}.credits{padding:13px 22px;border:1px solid #a83aff88;border-radius:30px;background:#241035;font-weight:bold}.login{border:0;color:#fff;background:linear-gradient(135deg,#8d28ff,#d327df);padding:12px 20px;border-radius:25px;font-weight:bold}.wrap{max-width:1000px;margin:auto;padding:10px 25px 50px}.card{border:1px solid #3d254f;border-radius:30px;background:#100b1b;padding:32px}.create{display:flex;align-items:center;gap:18px;margin-bottom:28px}.magic{width:90px;height:90px;border-radius:25px;display:flex;align-items:center;justify-content:center;font-size:45px;background:linear-gradient(135deg,#8d27ff,#d72ae8)}h2{font-size:38px;margin:0}.sub{color:#9c91a9;font-size:23px;margin-top:4px}.tabs{display:flex;background:#171321;border-radius:24px;padding:6px;margin-bottom:35px}.tab{flex:1;border:0;background:transparent;color:#aaa0b7;padding:19px;border-radius:19px;font-size:23px;font-weight:bold}.tab.active{color:white;background:linear-gradient(100deg,#7829dc,#d027d4)}.label{color:#aaa0b8;font-weight:bold;letter-spacing:1px;font-size:18px;margin:22px 0 13px}textarea{width:100%;height:220px;resize:none;background:#0d0915;color:white;border:1px solid #33253e;border-radius:25px;padding:25px;font-size:21px;outline:none}.counter{text-align:right;color:#777080;margin-top:-35px;margin-right:20px}.ideas{display:flex;gap:12px;margin:28px 0;flex-wrap:wrap}.idea,.option{border:1px solid #33253f;background:#110d19;color:#d9d0df;border-radius:25px;padding:14px 22px;font-weight:bold}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.option{text-align:left;padding:20px}.option strong{display:block;font-size:23px;color:#eee}.option span{color:#94899d;font-size:17px}.option.selected{border-color:#c02cff;background:#25123b}.duration{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.duration button{border:1px solid #33253f;background:#110d19;color:#c8bfce;padding:18px;border-radius:18px;font-weight:bold}.duration button.selected{background:linear-gradient(100deg,#7829dc,#c827d6);color:white}.generate{width:100%;margin-top:30px;padding:20px;border:0;border-radius:22px;color:white;font-size:22px;font-weight:bold;background:linear-gradient(100deg,#7928dc,#d128d7)}.status{display:none;margin-top:20px;padding:18px;border-radius:18px;background:#181020;border:1px solid #432650;text-align:center}.history{margin-top:25px}.item{padding:15px;border:1px solid #30203b;border-radius:16px;margin-top:10px;color:#a99faf;line-height:1.5;word-break:break-word}.empty{text-align:center;padding:25px;color:#746b7d;border:1px dashed #34253e;border-radius:16px}.userInfo{display:none;text-align:center;padding:15px;background:#181020;border:1px solid #3e2850;border-radius:15px;margin-bottom:20px}.userInfo strong{color:#d79aff}.logoutBtn{width:100%;padding:13px;border:1px solid #693450;background:#21111d;color:#ffbfd3;border-radius:13px;font-weight:bold;margin-top:10px}.modal{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;padding:20px;z-index:100}.modalbox{width:100%;max-width:440px;background:#130c1e;border:1px solid #7333a1;border-radius:25px;padding:28px}.close{float:right;background:none;border:0;color:#aaa;font-size:28px}.modalbox input{width:100%;padding:15px;margin:7px 0;border-radius:13px;border:1px solid #3b2948;background:#0c0812;color:white;outline:none}.mainbtn{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(100deg,#7d27df,#d22bd8);color:white;font-weight:bold;margin-top:12px}.googleBtn{background:#fff;color:#222}.switch{color:#b66cff;text-align:center;margin-top:18px;cursor:pointer}.authMessage{text-align:center;margin-top:14px;min-height:20px}@media(max-width:600px){.top{padding:18px 14px 10px}.brand{gap:10px}.brand h1{font-size:25px}.brand p{font-size:16px}.logo{width:58px;height:58px;font-size:32px}.credits{font-size:12px;padding:9px 10px}.login{padding:9px 11px;font-size:12px}.wrap{padding:8px 12px 35px}.card{padding:20px 15px;border-radius:23px}.magic{width:68px;height:68px;font-size:33px}h2{font-size:30px}.sub{font-size:17px}.tab{font-size:17px;padding:15px 8px}textarea{height:190px;font-size:17px;padding:20px}.grid2{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="brand"><div class="logo">✦</div><div><h1>FlowAI</h1><p>Studio</p></div></div><div class="userArea"><span class="credits">⚡ <span id="credits">50</span> credits</span><button class="login" id="loginButton" onclick="openLogin()">Login</button></div></header><main class="wrap"><section class="card"><div class="userInfo" id="userInfo">Logged in as <strong id="userName"></strong><div id="userEmail" style="color:#82758c;font-size:13px"></div><button class="logoutBtn" onclick="logoutUser()">Logout</button></div><div class="create"><div class="magic">🪄</div><div><h2>Create</h2><div class="sub">Describe your vision</div></div></div><div class="tabs"><button class="tab active" id="videoTab" onclick="setMode('Video')">🎞️ Video</button><button class="tab" id="audioTab" onclick="setMode('Audio')">♪ Audio</button></div><div class="label">PROMPT</div><textarea id="prompt" maxlength="500" placeholder="A cinematic shot of..." oninput="countText()"></textarea><div class="counter"><span id="count">0</span>/500</div><div class="ideas"><button class="idea" onclick="idea(1)">✦ Idea 1</button><button class="idea" onclick="idea(2)">✦ Idea 2</button><button class="idea" onclick="idea(3)">✦ Idea 3</button></div><div class="label">ASPECT RATIO</div><div class="grid2"><button class="option selected" id="r169" onclick="ratio('16:9')"><strong>▭ 16:9</strong><span>Landscape</span></button><button class="option" id="r916" onclick="ratio('9:16')"><strong>▯ 9:16</strong><span>Portrait</span></button></div><div class="label">DURATION</div><div class="duration"><button onclick="duration(5)" id="d5">5s</button><button onclick="duration(10)" id="d10" class="selected">10s</button><button onclick="duration(15)" id="d15">15s</button></div><button class="generate" onclick="generate()">⚡ Generate Video</button><div class="status" id="status"></div><div class="history"><h3>🕘 Recent Generations</h3><div id="historyList"><div class="empty">No generations yet</div></div></div></section></main><div class="modal" id="loginModal"><div class="modalbox"><button class="close" onclick="closeLogin()">×</button><h2>Welcome to FlowAI</h2><div style="color:#93859e;margin-bottom:18px">Login करें या नया account बनाएं</div><input id="name" placeholder="Your name"><input id="email" type="email" placeholder="Email address"><input id="password" type="password" placeholder="Password"><button class="mainbtn" onclick="emailAuth()">Login / Sign Up</button><button class="mainbtn googleBtn" onclick="googleLogin()">🔵 Continue with Google</button><div class="authMessage" id="authMessage"></div><div class="switch" onclick="closeLogin()">Continue as guest</div></div></div>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyBp_20zwhX39EP6GIYpSR6WbFbQHNGKwqY",authDomain:"flowai-studio.firebaseapp.com",projectId:"flowai-studio",storageBucket:"flowai-studio.firebasestorage.app",messagingSenderId:"990645093332",appId:"1:990645093332:web:27b88ffc3ee92d8b248c41",measurementId:"G-X3Z5XL1QLK"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),googleProvider=new firebase.auth.GoogleAuthProvider();let mode="Video",selectedRatio="16:9",selectedDuration=10,credits=50;
function setMode(x){mode=x;videoTab.classList.toggle("active",x==="Video");audioTab.classList.toggle("active",x==="Audio");document.querySelector(".generate").textContent=x==="Video"?"⚡ Generate Video":"🎵 Generate Audio"}function countText(){count.textContent=prompt.value.length}function idea(n){prompt.value=["A cinematic drone shot over a futuristic city at sunset, ultra realistic, dramatic lighting","A mysterious ancient temple hidden inside a beautiful jungle, cinematic atmosphere, realistic details","A magical night sky above the mountains with glowing stars, epic cinematic scene, ultra realistic"][n-1];countText()}function ratio(x){selectedRatio=x;r169.classList.toggle("selected",x==="16:9");r916.classList.toggle("selected",x==="9:16")}function duration(x){selectedDuration=x;[5,10,15].forEach(n=>document.getElementById("d"+n).classList.toggle("selected",n===x))}function showStatus(t){status.style.display="block";status.textContent=t}function generate(){let p=prompt.value.trim();if(!p)return showStatus("⚠️ Please enter a prompt first.");if(credits<=0)return showStatus("❌ Not enough credits.");credits--;document.getElementById("credits").textContent=credits;showStatus("✨ Your "+mode.toLowerCase()+" request has been created! ("+selectedDuration+"s • "+selectedRatio+")");if(historyList.children.length===1&&historyList.children[0].classList.contains("empty"))historyList.innerHTML="";let i=document.createElement("div");i.className="item";i.textContent="✨ "+mode+" • "+selectedDuration+"s • "+selectedRatio+" — "+p;historyList.prepend(i)}function openLogin(){loginModal.style.display="flex"}function closeLogin(){loginModal.style.display="none";authMessage.textContent=""}async function emailAuth(){let n=name.value.trim(),e=email.value.trim(),p=password.value,msg=authMessage;if(!e)return msg.textContent="⚠️ Email address डालें।";if(!p)return msg.textContent="⚠️ Password डालें।";if(p.length<6)return msg.textContent="⚠️ Password कम से कम 6 characters का होना चाहिए।";msg.textContent="⏳ Please wait...";try{let c=await auth.createUserWithEmailAndPassword(e,p);if(n)await c.user.updateProfile({displayName:n});closeLogin()}catch(x){if(x.code==="auth/email-already-in-use"){try{await auth.signInWithEmailAndPassword(e,p);closeLogin()}catch(y){msg.textContent=err(y)}}else msg.textContent=err(x)}}function googleLogin(){auth.signInWithRedirect(googleProvider).catch(e=>authMessage.textContent=err(e))}function logoutUser(){auth.signOut().then(()=>alert("✅ Logout successful!"))}function err(e){switch(e.code){case"auth/invalid-email":return"❌ Email address सही नहीं है।";case"auth/weak-password":return"❌ Password बहुत weak है।";case"auth/invalid-credential":return"❌ Email या password गलत है।";case"auth/unauthorized-domain":return"❌ Website Firebase Authorized Domains में नहीं है।";default:return"❌ "+(e.message||"Something went wrong.")}}auth.getRedirectResult().catch(console.log);auth.onAuthStateChanged(u=>{if(u){let n=u.displayName||u.email.split("@")[0];loginButton.textContent="👤 "+n;userName.textContent=n;userEmail.textContent=u.email||"";userInfo.style.display="block"}else{loginButton.textContent="Login";loginButton.onclick=openLogin;userInfo.style.display="none"}});loginModal.addEventListener("click",e=>{if(e.target===loginModal)closeLogin()});
</script></body></html>
