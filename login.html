<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowAI Studio - Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top,#1b0b35 0%,#09090d 45%,#050507 100%);
  color:#fff;
}

.card{
  width:100%;
  max-width:420px;
  background:#111116;
  border:1px solid #2b2b35;
  border-radius:18px;
  padding:30px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{text-align:center;color:#a855f7;font-size:27px;font-weight:bold;margin-bottom:10px}
h1{text-align:center;font-size:25px;margin-bottom:8px}
.subtitle{text-align:center;color:#777;font-size:13px;margin-bottom:25px}

.google{
  width:100%;height:48px;border:0;border-radius:8px;background:#fff;color:#222;
  font-size:14px;font-weight:bold;cursor:pointer;
}
.google:hover{background:#eee}
.google:disabled{opacity:.6;cursor:not-allowed}

.divider{display:flex;align-items:center;gap:10px;margin:22px 0;color:#666;font-size:12px}
.divider span{height:1px;background:#292932;flex:1}

input{
  width:100%;height:47px;margin-bottom:12px;padding:0 13px;
  background:#0b0b10;border:1px solid #30303a;border-radius:8px;
  color:#fff;outline:none;font-size:14px;
}
input:focus{border-color:#8b5cf6;box-shadow:0 0 0 2px rgba(139,92,246,.15)}

.primary{
  width:100%;height:47px;border:0;border-radius:8px;
  background:linear-gradient(135deg,#7c3aed,#9333ea);
  color:#fff;font-size:14px;font-weight:bold;cursor:pointer;
}
.primary:hover{opacity:.92}
.primary:disabled{opacity:.6;cursor:not-allowed}

.message{
  display:none;padding:11px;border-radius:7px;margin-bottom:15px;
  font-size:12px;line-height:1.4;
}
.error{background:#351719;border:1px solid #7f1d1d;color:#fca5a5}
.success{background:#12301f;border:1px solid #166534;color:#86efac}

.signup{text-align:center;margin-top:22px;color:#777;font-size:12px}
.signup a{color:#a970ff;font-weight:bold;cursor:pointer;text-decoration:none}
.signup a:hover{color:#fff}

.back-login{text-align:center;margin-top:18px;color:#777;font-size:12px}
.back-login a{color:#a970ff;font-weight:bold;cursor:pointer;text-decoration:none}
.back-login a:hover{color:#fff}

#signupForm{display:none}

@media(max-width:500px){
  body{padding:14px}
  .card{padding:25px 18px}
  .logo{font-size:24px}
  h1{font-size:23px}
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">FlowAI Studio</div>

  <div id="loginForm">

    <h1>Welcome back</h1>

    <p class="subtitle">
      Sign in to continue to FlowAI Studio
    </p>

    <div id="loginMessage" class="message"></div>

    <button id="googleLogin" class="google" onclick="googleLogin()">
      🔵 Continue with Google
    </button>

    <div class="divider">
      <span></span>
      OR
      <span></span>
    </div>

    <input type="email" id="loginEmail"
      placeholder="Email address" autocomplete="email">

    <input type="password" id="loginPassword"
      placeholder="Password" autocomplete="current-password">

    <button id="loginButton" class="primary" onclick="loginUser()">
      Login
    </button>

    <div class="signup">
      Don't have an account?
      <a onclick="showSignup()">Create account</a>
    </div>

  </div>

  <div id="signupForm">

    <h1>Create account</h1>

    <p class="subtitle">
      Create your FlowAI Studio account
    </p>

    <div id="signupMessage" class="message"></div>

    <input type="text" id="signupName"
      placeholder="Your name" autocomplete="name">

    <input type="email" id="signupEmail"
      placeholder="Email address" autocomplete="email">

    <input type="password" id="signupPassword"
      placeholder="Password (minimum 6 characters)" autocomplete="new-password">

    <input type="password" id="signupConfirm"
      placeholder="Confirm password" autocomplete="new-password">

    <button id="signupButton" class="primary" onclick="signupUser()">
      Create Account
    </button>

    <div class="back-login">
      Already have an account?
      <a onclick="showLogin()">Login</a>
    </div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  updateProfile
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBp_2OzwhX39EP6GIYpSR6WbFBqHNGKwqY",
  authDomain: "flowai-studio.firebaseapp.com",
  projectId: "flowai-studio",
  storageBucket: "flowai-studio.firebasestorage.app",
  messagingSenderId: "990645093332",
  appId: "1:990645093332:web:27b88ffc3ee92d8b248c41",
  measurementId: "G-X3Z5XL1QLK"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

function showMessage(id,message,type){
  const box = document.getElementById(id);
  box.innerText = message;
  box.className = "message " + type;
  box.style.display = "block";
}

function hideMessage(id){
  const box = document.getElementById(id);
  box.style.display = "none";
}

function getFirebaseError(error){
  switch(error.code){
    case "auth/invalid-credential":
      return "Email or password is incorrect.";
    case "auth/invalid-email":
      return "Please enter a valid email address.";
    case "auth/user-not-found":
      return "No account found with this email.";
    case "auth/wrong-password":
      return "Incorrect password.";
    case "auth/email-already-in-use":
      return "An account already exists with this email.";
    case "auth/weak-password":
      return "Password is too weak. Use at least 6 characters.";
    case "auth/popup-closed-by-user":
      return "Google login was cancelled.";
    case "auth/popup-blocked":
      return "Google popup was blocked. Please allow popups and try again.";
    case "auth/unauthorized-domain":
      return "This website domain is not authorized in Firebase.";
    case "auth/network-request-failed":
      return "Network error. Check your internet connection.";
    default:
      return error.message || "Something went wrong. Please try again.";
  }
}

function openStudio(){
  // IMPORTANT: The app is index.html, not "/".
  window.location.replace("/index.html");
}

window.googleLogin = async function(){
  const button = document.getElementById("googleLogin");

  button.disabled = true;
  button.innerText = "Connecting to Google...";
  hideMessage("loginMessage");

  try{
    const result = await signInWithPopup(auth, provider);
    const user = result.user;

    localStorage.setItem("user", user.email || "");
    localStorage.setItem("uid", user.uid);
    localStorage.setItem("displayName", user.displayName || "");

    showMessage(
      "loginMessage",
      "Login successful! Opening FlowAI Studio...",
      "success"
    );

    setTimeout(openStudio, 500);

  }catch(error){
    console.error(error);

    showMessage(
      "loginMessage",
      getFirebaseError(error),
      "error"
    );

    button.disabled = false;
    button.innerText = "🔵 Continue with Google";
  }
};

window.loginUser = async function(){

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const button = document.getElementById("loginButton");

  hideMessage("loginMessage");

  if(!email){
    showMessage("loginMessage","Please enter your email address.","error");
    return;
  }

  if(!password){
    showMessage("loginMessage","Please enter your password.","error");
    return;
  }

  button.disabled = true;
  button.innerText = "Logging in...";

  try{
    const result =
      await signInWithEmailAndPassword(auth,email,password);

    const user = result.user;

    localStorage.setItem("user", user.email || "");
    localStorage.setItem("uid", user.uid);
    localStorage.setItem("displayName", user.displayName || "");

    showMessage(
      "loginMessage",
      "Login successful! Opening FlowAI Studio...",
      "success"
    );

    setTimeout(openStudio, 500);

  }catch(error){
    console.error(error);

    showMessage(
      "loginMessage",
      getFirebaseError(error),
      "error"
    );

    button.disabled = false;
    button.innerText = "Login";
  }
};

window.signupUser = async function(){

  const name = document.getElementById("signupName").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;
  const confirm = document.getElementById("signupConfirm").value;
  const button = document.getElementById("signupButton");

  hideMessage("signupMessage");

  if(!name){
    showMessage("signupMessage","Please enter your name.","error");
    return;
  }

  if(!email){
    showMessage("signupMessage","Please enter your email address.","error");
    return;
  }

  if(password.length < 6){
    showMessage(
      "signupMessage",
      "Password must be at least 6 characters.",
      "error"
    );
    return;
  }

  if(password !== confirm){
    showMessage(
      "signupMessage",
      "Passwords do not match.",
      "error"
    );
    return;
  }

  button.disabled = true;
  button.innerText = "Creating account...";

  try{

    const result =
      await createUserWithEmailAndPassword(auth,email,password);

    const user = result.user;

    await updateProfile(user,{displayName:name});

    localStorage.setItem("user", user.email || "");
    localStorage.setItem("uid", user.uid);
    localStorage.setItem("displayName", name);

    showMessage(
      "signupMessage",
      "Account created successfully! Opening FlowAI Studio...",
      "success"
    );

    setTimeout(openStudio, 700);

  }catch(error){
    console.error(error);

    showMessage(
      "signupMessage",
      getFirebaseError(error),
      "error"
    );

    button.disabled = false;
    button.innerText = "Create Account";
  }
};

window.showSignup = function(){
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("signupForm").style.display = "block";
  hideMessage("loginMessage");
};

window.showLogin = function(){
  document.getElementById("signupForm").style.display = "none";
  document.getElementById("loginForm").style.display = "block";
  hideMessage("signupMessage");
};

</script>

</body>
</html>
