<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlowAI Login</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#32105a,#0b0714 55%);color:#fff;font-family:Arial}.card{width:min(430px,92%);background:#100b1b;border:1px solid #4b2860;border-radius:25px;padding:28px;box-shadow:0 20px 70px #0008}.logo{width:70px;height:70px;margin:auto auto 18px;border-radius:20px;display:grid;place-items:center;font-size:36px;background:linear-gradient(135deg,#9b24ff,#d82be9)}h1{text-align:center}.sub{text-align:center;color:#aaa;margin-bottom:22px}.tabs{display:flex;background:#181321;padding:5px;border-radius:14px}.tabs button{flex:1;padding:12px;border:0;background:transparent;color:#aaa;border-radius:10px;font-weight:bold}.tabs .active{background:linear-gradient(100deg,#7928dc,#d128d7);color:#fff}input{width:100%;padding:14px;margin:6px 0;background:#0b0811;border:1px solid #3b2948;border-radius:12px;color:#fff;font-size:16px}.action,.google{width:100%;padding:14px;margin-top:10px;border:0;border-radius:12px;font-weight:bold}.action{background:linear-gradient(100deg,#7928dc,#d128d7);color:#fff}.google{background:#fff;color:#222}.msg{text-align:center;color:#ff86a8;min-height:25px;margin-top:12px}</style></head><body><div class="card"><div class="logo">✦</div><h1>FlowAI Studio</h1><div class="sub">Login or create your account</div><div class="tabs"><button id="lt" class="active">Login</button><button id="st">Sign Up</button></div><input id="name" placeholder="Your name" style="display:none"><input id="email" type="email" placeholder="Email address"><input id="pass" type="password" placeholder="Password (minimum 6 characters)"><button id="go" class="action">Login</button><button id="google" class="google">🔵 Continue with Google</button><div id="msg" class="msg"></div></div>
<script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script><script>
const cfg={"apiKey":"AIzaSyBp_2OzwhX39EP6GIYpSR6WbFBqHNGKwqY","authDomain":"flowai-studio.firebaseapp.com","projectId":"flowai-studio","storageBucket":"flowai-studio.firebasestorage.app","messagingSenderId":"990645093332","appId":"1:990645093332:web:27b88ffc3ee92d8b248c41","measurementId":"G-X3Z5XL1QLK"};firebase.initializeApp(cfg);const auth=firebase.auth();let signup=false,$=id=>document.getElementById(id);
function mode(x){signup=x;$('lt').classList.toggle('active',!x);$('st').classList.toggle('active',x);$('name').style.display=x?'block':'none';$('go').textContent=x?'Create Account':'Login';$('msg').textContent=''}
$('lt').onclick=()=>mode(false);$('st').onclick=()=>mode(true);
$('go').onclick=async()=>{let e=$('email').value.trim(),p=$('pass').value,n=$('name').value.trim();if(!e||!p||(signup&&!n)){ $('msg').textContent='Please fill all fields.';return}if(p.length<6){$('msg').textContent='Password must be at least 6 characters.';return}$('go').disabled=true;try{if(signup){let r=await auth.createUserWithEmailAndPassword(e,p);await r.user.updateProfile({displayName:n})}else await auth.signInWithEmailAndPassword(e,p);location.replace('/index.html')}catch(x){$('msg').textContent=x.message||'Authentication failed'}finally{$('go').disabled=false}};
$('google').onclick=async()=>{try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());location.replace('/index.html')}catch(x){$('msg').textContent=x.message||'Google login failed'}};
auth.onAuthStateChanged(u=>{if(u)location.replace('/index.html')});
</script></body></html>
