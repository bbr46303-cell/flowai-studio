<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FlowAI Studio</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Inter,Arial,sans-serif;
 color:#f7efff;
 background:
 radial-gradient(circle at 15% 0%,#6810ad 0,transparent 30%),
 radial-gradient(circle at 100% 30%,#360061 0,transparent 35%),
 #0b0714;
 min-height:100vh;
}

button,input,textarea{font:inherit}
button{cursor:pointer}

.login-page{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;
}

.login-card{
 width:100%;
 max-width:500px;
 background:#100a1b;
 border:1px solid #8b36bd;
 border-radius:32px;
 padding:40px 30px;
 box-shadow:0 0 70px #8c20d955;
 text-align:center;
}

.big-logo{
 width:120px;
 height:120px;
 margin:0 auto 25px;
 border-radius:32px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:65px;
 background:linear-gradient(135deg,#9b24ff,#d82be9);
 box-shadow:0 0 45px #a626ff66;
}

.login-card h1{
 margin:0;
 font-size:40px;
}

.login-card p{
 color:#aaa0b0;
 font-size:18px;
 line-height:1.5;
 margin:10px 0 25px;
}

.auth-tabs{
 display:flex;
 background:#181321;
 padding:5px;
 border-radius:18px;
 margin-bottom:18px;
}

.auth-tab{
 flex:1;
 padding:14px;
 border:0;
 background:transparent;
 color:#9d94a7;
 border-radius:14px;
 font-weight:bold;
}

.auth-tab.active{
 color:white;
 background:linear-gradient(100deg,#7928dc,#d128d7);
}

.auth-input{
 width:100%;
 padding:16px;
 margin:7px 0;
 border-radius:14px;
 border:1px solid #3b2948;
 background:#0b0811;
 color:white;
 outline:none;
}

.auth-input:focus{
 border-color:#bd2dff;
}

.main-btn{
 width:100%;
 padding:16px;
 border:0;
 border-radius:15px;
 margin-top:12px;
 color:white;
 font-weight:bold;
 background:linear-gradient(100deg,#7928dc,#d128d7);
 box-shadow:0 10px 30px #a127d944;
}

.main-btn:disabled{
 opacity:.6;
 cursor:not-allowed;
}

.google-btn{
 width:100%;
 padding:16px;
 border:0;
 border-radius:15px;
 margin-top:12px;
 background:white;
 color:#222;
 font-weight:bold;
}

.or{
 color:#777080;
 margin:18px 0;
}

.auth-message{
 min-height:25px;
 margin-top:14px;
 color:#ff86a8;
 font-size:15px;
 line-height:1.4;
}

/* STUDIO */

#studioPage{
 display:none;
}

.top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:24px 26px 18px;
 max-width:900px;
 margin:auto;
}

.brand{
 display:flex;
 align-items:center;
 gap:15px;
}

.logo{
 width:68px;
 height:68px;
 border-radius:21px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:36px;
 background:linear-gradient(135deg,#9b24ff,#d82be9);
 box-shadow:0 0 35px #a626ff66;
}

.brand h1{
 margin:0;
 font-size:30px;
}

.brand p{
 margin:3px 0;
 color:#c38cff;
 font-size:19px;
}

.user-area{
 display:flex;
 align-items:center;
 gap:9px;
 flex-wrap:wrap;
 justify-content:flex-end;
}

.credits{
 padding:12px 18px;
 border:1px solid #a83aff88;
 border-radius:30px;
 background:#241035;
 font-weight:bold;
}

.user-name{
 color:#d2a4ff;
 font-weight:bold;
}

.logout{
 border:1px solid #753b91;
 background:#160d20;
 color:#ddd;
 padding:10px 15px;
 border-radius:22px;
}

.wrap{
 max-width:900px;
 margin:auto;
 padding:10px 25px 50px;
}

.card{
 border:1px solid #3d254f;
 border-radius:30px;
 background:#100b1bdb;
 padding:32px;
 box-shadow:0 0 50px #6c0c9b20;
}

.create{
 display:flex;
 align-items:center;
 gap:18px;
 margin-bottom:28px;
}

.magic{
 width:88px;
 height:88px;
 border-radius:25px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:44px;
 background:linear-gradient(135deg,#8d27ff,#d72ae8);
}

h2{
 font-size:38px;
 margin:0;
}

.sub{
 color:#9c91a9;
 font-size:22px;
 margin-top:4px;
}

.tabs{
 display:flex;
 background:#171321;
 border-radius:23px;
 padding:6px;
 margin-bottom:32px;
}

.tab{
 flex:1;
 border:0;
 background:transparent;
 color:#aaa0b7;
 padding:18px;
 border-radius:18px;
 font-size:22px;
 font-weight:bold;
}

.tab.active{
 color:white;
 background:linear-gradient(100deg,#7829dc,#d027d4);
 box-shadow:0 8px 25px #a423db55;
}

.label{
 color:#aaa0b8;
 font-weight:bold;
 letter-spacing:1px;
 font-size:17px;
 margin:22px 0 12px;
}

textarea{
 width:100%;
 height:210px;
 resize:none;
 background:#0d0915;
 color:white;
 border:1px solid #33253e;
 border-radius:24px;
 padding:23px;
 font-size:20px;
 outline:none;
}

textarea:focus{
 border-color:#b22cff;
}

.counter{
 text-align:right;
 color:#777080;
 margin-top:-34px;
 margin-right:18px;
}

.ideas{
 display:flex;
 gap:10px;
 margin:27px 0;
 flex-wrap:wrap;
}

.idea,.option{
 border:1px solid #33253f;
 background:#110d19;
 color:#d9d0df;
 border-radius:24px;
 padding:13px 20px;
 font-weight:bold;
}

.idea:hover,.option:hover{
 border-color:#b52cff;
}

.grid2{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:14px;
}

.option{
 text-align:left;
 padding:19px;
}

.option strong{
 display:block;
 font-size:22px;
 color:#eee;
}

.option span{
 color:#94899d;
 font-size:16px;
}

.option.selected{
 border-color:#c02cff;
 background:linear-gradient(135deg,#25123b,#17101f);
 box-shadow:0 0 25px #a928ff22;
}

.duration{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:11px;
}

.duration button{
 border:1px solid #33253f;
 background:#110d19;
 color:#c8bfce;
 padding:17px;
 border-radius:17px;
 font-weight:bold;
}

.duration button.selected{
 background:linear-gradient(100deg,#7829dc,#c827d6);
 color:white;
 border-color:#c52aff;
}

.generate{
 width:100%;
 margin-top:28px;
 padding:19px;
 border:0;
 border-radius:21px;
 color:white;
 font-size:21px;
 font-weight:bold;
 background:linear-gradient(100deg,#7928dc,#d128d7);
 box-shadow:0 10px 35px #a127d94d;
}

.generate:disabled{
 opacity:.6;
}

.status{
 display:none;
 margin-top:18px;
 padding:17px;
 border-radius:17px;
 background:#181020;
 border:1px solid #432650;
 text-align:center;
 color:#d7c5e5;
}

.history{
 margin-top:25px;
}

.history h3{
 font-size:21px;
}

.item{
 padding:14px;
 border:1px solid #30203b;
 border-radius:15px;
 margin-top:9px;
 color:#a99faf;
 word-break:break-word;
}

@media(max-width:600px){

 .login-card{
  padding:32px 20px;
 }

 .big-logo{
  width:105px;
  height:105px;
  font-size:55px;
 }

 .login-card h1{
  font-size:33px;
 }

 .top{
  padding:17px;
  align-items:flex-start;
 }

 .brand h1{
  font-size:26px;
 }

 .brand p{
  font-size:17px;
 }

 .logo{
  width:58px;
  height:58px;
 }

 .user-area{
  gap:5px;
 }

 .credits{
  font-size:13px;
  padding:9px 11px;
 }

 .user-name{
  font-size:13px;
 }

 .logout{
  padding:8px 11px;
  font-size:12px;
 }

 .wrap{
  padding:8px 14px 35px;
 }

 .card{
  padding:21px 17px;
 }

 .magic{
  width:70px;
  height:70px;
  font-size:34px;
 }

 h2{
  font-size:30px;
 }

 .sub{
  font-size:17px;
 }

 .tab{
  font-size:17px;
  padding:15px 7px;
 }

 textarea{
  height:195px;
  font-size:18px;
 }

 .grid2{
  grid-template-columns:1fr;
 }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="loginPage" class="login-page">

<div class="login-card">

<div class="big-logo">✦</div>

<h1>Welcome to FlowAI</h1>

<p>
Login या Sign Up करें और<br>
FlowAI Studio इस्तेमाल करें।
</p>

<div class="auth-tabs">

<button
 id="loginTab"
 class="auth-tab active"
 type="button">
Login
</button>

<button
 id="signupTab"
 class="auth-tab"
 type="button">
Sign Up
</button>

</div>

<input
 id="authName"
 class="auth-input"
 placeholder="Your name"
 autocomplete="name"
 style="display:none">

<input
 id="authEmail"
 class="auth-input"
 type="email"
 placeholder="Email address"
 autocomplete="email">

<input
 id="authPassword"
 class="auth-input"
 type="password"
 placeholder="Password"
 autocomplete="current-password">

<button
 id="authButton"
 class="main-btn"
 type="button">
Login
</button>

<div class="or">OR</div>

<button
 id="googleButton"
 class="google-btn"
 type="button">
🔵 Continue with Google
</button>

<div
 id="authMessage"
 class="auth-message">
</div>

</div>

</section>


<!-- ================= STUDIO ================= -->

<section id="studioPage">

<header class="top">

<div class="brand">

<div class="logo">✦</div>

<div>
<h1>FlowAI</h1>
<p>Studio</p>
</div>

</div>

<div class="user-area">

<span class="credits">
⚡ <span id="credits">50</span> credits
</span>

<span
 class="user-name"
 id="userName">
👤 User
</span>

<button
 class="logout"
 id="logoutButton"
 type="button">
Logout
</button>

</div>

</header>


<main class="wrap">

<section class="card">

<div class="create">

<div class="magic">
🪄
</div>

<div>
<h2>Create</h2>
<div class="sub">
Describe your vision
</div>
</div>

</div>


<div class="tabs">

<button
 id="videoTab"
 class="tab active"
 type="button">
🎞️ Video
</button>

<button
 id="audioTab"
 class="tab"
 type="button">
♪ Audio
</button>

</div>


<div class="label">
PROMPT
</div>

<textarea
 id="prompt"
 maxlength="500"
 placeholder="A cinematic shot of...">
</textarea>

<div class="counter">
<span id="count">0</span>/500
</div>


<div class="ideas">

<button
 class="idea"
 data-idea="1"
 type="button">
✦ Idea 1
</button>

<button
 class="idea"
 data-idea="2"
 type="button">
✦ Idea 2
</button>

<button
 class="idea"
 data-idea="3"
 type="button">
✦ Idea 3
</button>

</div>


<div class="label">
ASPECT RATIO
</div>

<div class="grid2">

<button
 id="r169"
 class="option selected"
 type="button">

<strong>▭ 16:9</strong>
<span>Landscape</span>

</button>

<button
 id="r916"
 class="option"
 type="button">

<strong>▯ 9:16</strong>
<span>Portrait</span>

</button>

</div>


<div class="label">
DURATION
</div>

<div class="duration">

<button id="d5" type="button">
5s
</button>

<button
 id="d10"
 class="selected"
 type="button">
10s
</button>

<button id="d15" type="button">
15s
</button>

</div>


<button
 id="generateButton"
 class="generate"
 type="button">
⚡ Generate Video
</button>


<div
 id="status"
 class="status">
</div>


<div class="history">

<h3>🕘 Recent Generations</h3>

<div id="historyList">

<div class="item">
No generations yet
</div>

</div>

</div>

</section>

</main>

</section>


<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


<script>

const firebaseConfig = {

 apiKey:
 "AIzaSyBp_2OzwhX39EP6GIYpSR6WbFBqHNGKwqY",

 authDomain:
 "flowai-studio.firebaseapp.com",

 projectId:
 "flowai-studio",

 storageBucket:
 "flowai-studio.firebasestorage.app",

 messagingSenderId:
 "990645093332",

 appId:
 "1:990645093332:web:27b88ffc3ee92d8b248c41",

 measurementId:
 "G-X3Z5XL1QLK"

};


firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

auth.setPersistence(
 firebase.auth.Auth.Persistence.LOCAL
).catch(function(error){
 console.error(error);
});


let authMode = "login";

let mode = "Video";

let selectedRatio = "16:9";

let selectedDuration = 10;

let credits = 50;

let currentUser = null;


function $(id){

 return document.getElementById(id);

}


/* ================= AUTH MODE ================= */

function setAuthMode(type){

 authMode = type;

 $("loginTab").classList.toggle(
  "active",
  type === "login"
 );

 $("signupTab").classList.toggle(
  "active",
  type === "signup"
 );

 $("authName").style.display =
  type === "signup"
   ? "block"
   : "none";

 $("authPassword").autocomplete =
  type === "login"
   ? "current-password"
   : "new-password";

 $("authButton").textContent =
  type === "login"
   ? "Login"
   : "Create Account";

 $("authMessage").textContent = "";

}


$("loginTab").addEventListener(
 "click",
 function(){
  setAuthMode("login");
 }
);


$("signupTab").addEventListener(
 "click",
 function(){
  setAuthMode("signup");
 }
);


/* ================= MESSAGE ================= */

function showAuthMessage(text){

 $("authMessage").textContent = text;

}


/* ================= EMAIL LOGIN / SIGNUP ================= */

async function handleAuth(){

 const email =
  $("authEmail").value.trim();

 const password =
  $("authPassword").value;

 const name =
  $("authName").value.trim();

 showAuthMessage("");

 if(!email){

  showAuthMessage(
   "⚠️ Email डालें।"
  );

  return;
 }

 if(!password){

  showAuthMessage(
   "⚠️ Password डालें।"
  );

  return;
 }

 if(
  authMode === "signup" &&
  !name
 ){

  showAuthMessage(
   "⚠️ अपना नाम डालें।"
  );

  return;
 }


 const button =
  $("authButton");

 button.disabled = true;

 button.textContent =
  "⏳ Please wait...";


 try{

  if(authMode === "login"){

   await auth.signInWithEmailAndPassword(
    email,
    password
   );

  }else{

   const result =
    await auth.createUserWithEmailAndPassword(
     email,
     password
    );

   await result.user.updateProfile({
    displayName:name
   });

   await result.user.reload();

  }

 }catch(error){

  console.error(
   "Firebase Auth Error:",
   error
  );

  let message =
   "❌ Login failed. Please try again.";

  if(
   error.code ===
   "auth/invalid-credential"
  ){

   message =
    "❌ Email या password गलत है।";

  }else if(
   error.code ===
   "auth/user-not-found"
  ){

   message =
    "❌ Account नहीं मिला। पहले Sign Up करें।";

  }else if(
   error.code ===
   "auth/wrong-password"
  ){

   message =
    "❌ Password गलत है।";

  }else if(
   error.code ===
   "auth/email-already-in-use"
  ){

   message =
    "❌ यह email पहले से registered है।";

  }else if(
   error.code ===
   "auth/weak-password"
  ){

   message =
    "❌ Password कम से कम 6 characters का होना चाहिए।";

  }else if(
   error.code ===
   "auth/invalid-email"
  ){

   message =
    "❌ Email सही नहीं है।";

  }else if(
   error.code ===
   "auth/too-many-requests"
  ){

   message =
    "❌ बहुत ज्यादा attempts हुए हैं। थोड़ी देर बाद कोशिश करें।";

  }

  showAuthMessage(message);

 }finally{

  button.disabled = false;

  button.textContent =
   authMode === "login"
    ? "Login"
    : "Create Account";

 }

}


$("authButton").addEventListener(
 "click",
 handleAuth
);


/* ENTER KEY */

$("authEmail").addEventListener(
 "keydown",
 function(event){

  if(event.key === "Enter"){
   handleAuth();
  }

 }
);


$("authPassword").addEventListener(
 "keydown",
 function(event){

  if(event.key === "Enter"){
   handleAuth();
  }

 }
);


/* ================= GOOGLE LOGIN ================= */

async function googleLogin(){

 showAuthMessage("");

 try{

  const provider =
   new firebase.auth.GoogleAuthProvider();

  provider.setCustomParameters({
   prompt:"select_account"
  });

  await auth.signInWithRedirect(
   provider
  );

 }catch(error){

  console.error(error);

  showAuthMessage(
   "❌ Google Login: " +
   (error.message || "Failed")
  );

 }

}


$("googleButton").addEventListener(
 "click",
 googleLogin
);


/* ================= GOOGLE REDIRECT ================= */

auth.getRedirectResult()
.catch(function(error){

 if(error){

  console.error(error);

  showAuthMessage(
   "❌ Google Login: " +
   (error.message || "Failed")
  );

 }

});


/* ================= AUTH STATE ================= */

auth.onAuthStateChanged(
 function(user){

  if(user){

   currentUser = user;

   showStudio(user);

  }else{

   currentUser = null;

   showLogin();

  }

 }
);


/* ================= SHOW LOGIN ================= */

function showLogin(){

 $("loginPage").style.display =
  "flex";

 $("studioPage").style.display =
  "none";

}


/* ================= SHOW STUDIO ================= */

function showStudio(user){

 $("loginPage").style.display =
  "none";

 $("studioPage").style.display =
  "block";

 const displayName =
  user.displayName ||
  (
   user.email
    ? user.email.split("@")[0]
    : "User"
  );

 $("userName").textContent =
  "👤 " + displayName;

 loadCredits(user);

 loadHistory(user);

 window.scrollTo(0,0);

}


/* ================= LOGOUT ================= */

async function logout(){

 try{

  await auth.signOut();

 }catch(error){

  console.error(error);

 }

}


$("logoutButton").addEventListener(
 "click",
 logout
);


/* ================= CREDITS ================= */

function getUserKey(user){

 return "flowaiCredits_" +
  user.uid;

}


function loadCredits(user){

 const key =
  getUserKey(user);

 const saved =
  localStorage.getItem(key);

 if(saved === null){

  credits = 50;

  localStorage.setItem(
   key,
   "50"
  );

 }else{

  credits =
   parseInt(saved,10);

  if(
   Number.isNaN(credits)
  ){

   credits = 50;

  }

 }

 $("credits").textContent =
  credits;

}


function saveCredits(user){

 if(!user) return;

 localStorage.setItem(
  getUserKey(user),
  String(credits)
 );

}


/* ================= MODE ================= */

function setMode(x){

 mode = x;

 $("videoTab").classList.toggle(
  "active",
  x === "Video"
 );

 $("audioTab").classList.toggle(
  "active",
  x === "Audio"
 );

 $("generateButton").textContent =
  x === "Video"
   ? "⚡ Generate Video"
   : "🎵 Generate Audio";

}


$("videoTab").addEventListener(
 "click",
 function(){
  setMode("Video");
 }
);


$("audioTab").addEventListener(
 "click",
 function(){
  setMode("Audio");
 }
);


/* ================= COUNTER ================= */

function countText(){

 $("count").textContent =
  $("prompt").value.length;

}


$("prompt").addEventListener(
 "input",
 countText
);


/* ================= IDEAS ================= */

const ideas = [

 "A cinematic drone shot over a futuristic city at sunset, ultra realistic, dramatic lighting",

 "A mysterious ancient temple hidden inside a beautiful jungle, cinematic atmosphere, realistic details",

 "A magical night sky above the mountains with glowing stars, epic cinematic scene, ultra realistic"

];


document
 .querySelectorAll(".idea")
 .forEach(function(button){

  button.addEventListener(
   "click",
   function(){

    const number =
     Number(button.dataset.idea);

    $("prompt").value =
     ideas[number - 1];

    countText();

   }
  );

 });


/* ================= RATIO ================= */

function ratio(x){

 selectedRatio = x;

 $("r169").classList.toggle(
  "selected",
  x === "16:9"
 );

 $("r916").classList.toggle(
  "selected",
  x === "9:16"
 );

}


$("r169").addEventListener(
 "click",
 function(){
  ratio("16:9");
 }
);


$("r916").addEventListener(
 "click",
 function(){
  ratio("9:16");
 }
);


/* ================= DURATION ================= */

function duration(x){

 selectedDuration = x;

 [5,10,15].forEach(
  function(number){

   $("d"+number)
    .classList.toggle(
     "selected",
     number === x
    );

  }
 );

}


[5,10,15].forEach(
 function(number){

  $("d"+number)
   .addEventListener(
    "click",
    function(){
     duration(number);
    }
   );

 }
);


/* ================= STATUS ================= */

function showStatus(text){

 const status =
  $("status");

 status.style.display =
  "block";

 status.textContent =
  text;

  $("historyList");

   );

  history = [];

 }


 if(!history.length){

  list.innerHTML =
   '<div class="item">No generations yet</div>';

  return;

 }


 history.forEach(
  function(item){

   addHistoryItem(item);

  }
 );

}

   );

  history = [];

 }

 history.unshift(item);

 history =
  history.slice(0,20);

 localStorage.setItem(
  key,

 );

}
