<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0714">
<title>FlowAI Studio</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;background:#0b0714}
body{
 font-family:Arial,Inter,sans-serif;
 color:#f7efff;
 background:
 radial-gradient(circle at 15% 0%,#6810ad 0,transparent 30%),
 radial-gradient(circle at 100% 30%,#360061 0,transparent 35%),
 #0b0714;
}
button,input,textarea{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,textarea{font-size:16px}
.hidden{display:none!important}

/* LOGIN */
.login-page{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px 14px;
}
.login-card{
 width:100%;
 max-width:560px;
 background:#100a1b;
 border:1px solid #8b36bd;
 border-radius:32px;
 padding:38px 34px;
 box-shadow:0 0 70px #8c20d955;
 text-align:center;
}
.big-logo{
 width:140px;height:140px;margin:0 auto 28px;
 border-radius:38px;
 display:flex;align-items:center;justify-content:center;
 font-size:75px;
 background:linear-gradient(135deg,#9b24ff,#d82be9);
 box-shadow:0 0 45px #a626ff66;
}
.login-card h1{font-size:43px;margin:0}
.login-card p{
 color:#a99daf;font-size:21px;line-height:1.45;
 margin:10px 0 30px
}
.auth-tabs{
 display:flex;background:#181321;padding:5px;
 border-radius:18px;margin-bottom:20px
}
.auth-tab{
 flex:1;padding:16px;border:0;background:transparent;
 color:#9d94a7;border-radius:14px;font-weight:bold
}
.auth-tab.active{
 color:#fff;background:linear-gradient(100deg,#7928dc,#d128d7)
}
.auth-input{
 width:100%;padding:17px 18px;margin:7px 0;
 border-radius:15px;border:1px solid #3b2948;
 background:#0b0811;color:#fff;outline:none;
}
.auth-input:focus{border-color:#bd2dff}
.main-btn,.google-btn{
 width:100%;padding:17px;border:0;border-radius:16px;
 margin-top:12px;font-weight:bold
}
.main-btn{
 color:#fff;background:linear-gradient(100deg,#7928dc,#d128d7);
 box-shadow:0 10px 30px #a127d944
}
.google-btn{background:#fff;color:#222}
.main-btn:disabled{opacity:.6}
.or{color:#777080;margin:18px 0}
.auth-message{
 min-height:25px;margin-top:15px;color:#ff86a8;
 font-size:15px;line-height:1.4
}

/* STUDIO */
#studioPage{min-height:100vh}
.top{
 display:flex;align-items:center;justify-content:space-between;
 padding:24px 26px 18px;max-width:900px;margin:auto;gap:15px
}
.brand{display:flex;align-items:center;gap:16px}
.logo{
 width:70px;height:70px;border-radius:22px;
 display:flex;align-items:center;justify-content:center;
 font-size:38px;background:linear-gradient(135deg,#9b24ff,#d82be9);
 box-shadow:0 0 35px #a626ff66
}
.brand h1{margin:0;font-size:31px}
.brand p{margin:3px 0;color:#c38cff;font-size:20px}
.user-area{
 display:flex;align-items:center;gap:10px;
 flex-wrap:wrap;justify-content:flex-end
}
.credits{
 padding:13px 20px;border:1px solid #a83aff88;
 border-radius:30px;background:#241035;font-weight:bold
}
.user-name{color:#d2a4ff;font-weight:bold;font-size:18px}
.logout{
 border:1px solid #753b91;background:#160d20;color:#ddd;
 padding:10px 16px;border-radius:22px
}
.wrap{max-width:900px;margin:auto;padding:10px 25px 50px}
.card{
 border:1px solid #3d254f;border-radius:30px;background:#100b1bdb;
 padding:32px;box-shadow:0 0 50px #6c0c9b20
}
.create{display:flex;align-items:center;gap:18px;margin-bottom:28px}
.magic{
 width:90px;height:90px;border-radius:25px;
 display:flex;align-items:center;justify-content:center;
 font-size:45px;background:linear-gradient(135deg,#8d27ff,#d72ae8)
}
h2{font-size:38px;margin:0}
.sub{color:#9c91a9;font-size:23px;margin-top:4px}
.tabs{display:flex;background:#171321;border-radius:24px;padding:6px;margin-bottom:35px}
.tab{
 flex:1;border:0;background:transparent;color:#aaa0b7;
 padding:19px;border-radius:19px;font-size:23px;font-weight:bold
}
.tab.active{
 color:#fff;background:linear-gradient(100deg,#7829dc,#d027d4);
 box-shadow:0 8px 25px #a423db55
}
.label{color:#aaa0b8;font-weight:bold;letter-spacing:1px;font-size:18px;margin:22px 0 13px}
textarea{
 width:100%;height:220px;resize:none;background:#0d0915;color:#fff;
 border:1px solid #33253e;border-radius:25px;padding:25px;
 font-size:21px;outline:none
}
textarea:focus{border-color:#b22cff}
.counter{text-align:right;color:#777080;margin-top:-35px;margin-right:20px}
.ideas{display:flex;gap:12px;margin:28px 0;flex-wrap:wrap}
.idea,.option{
 border:1px solid #33253f;background:#110d19;color:#d9d0df;
 border-radius:25px;padding:14px 22px;font-weight:bold
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.option{text-align:left;padding:20px;border-radius:25px}
.option strong{display:block;font-size:23px;color:#eee}
.option span{color:#94899d;font-size:17px}
.option.selected{
 border-color:#c02cff;background:linear-gradient(135deg,#25123b,#17101f);
 box-shadow:0 0 25px #a928ff22
}
.duration{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.duration button{
 border:1px solid #33253f;background:#110d19;color:#c8bfce;
 padding:18px;border-radius:18px;font-weight:bold
}
.duration button.selected{
 background:linear-gradient(100deg,#7829dc,#c827d6);
 color:#fff;border-color:#c52aff
}
.generate{
 width:100%;margin-top:30px;padding:20px;border:0;border-radius:22px;
 color:#fff;font-size:22px;font-weight:bold;
 background:linear-gradient(100deg,#7928dc,#d128d7);
 box-shadow:0 10px 35px #a127d94d
}
.generate:disabled{opacity:.6}
.status{
 display:none;margin-top:20px;padding:18px;border-radius:18px;
 background:#181020;border:1px solid #432650;
 text-align:center;color:#d7c5e5;line-height:1.5
}
.history{margin-top:25px}
.history h3{font-size:22px}
.item{
 padding:15px;border:1px solid #30203b;border-radius:16px;
 margin-top:10px;color:#a99faf;word-break:break-word
}
.video-result{width:100%;margin-top:15px;border-radius:18px}

/* MOBILE */
@media(max-width:600px){
 .login-page{padding:12px}
 .login-card{padding:30px 18px;border-radius:28px}
 .big-logo{width:112px;height:112px;font-size:58px;margin-bottom:22px}
 .login-card h1{font-size:34px}
 .login-card p{font-size:18px}
 .auth-tab{padding:15px 8px}
 .top{padding:18px 14px 10px;align-items:flex-start}
 .brand{gap:10px}
 .brand h1{font-size:26px}
 .brand p{font-size:17px}
 .logo{width:60px;height:60px;font-size:32px}
 .user-area{gap:6px}
 .credits{font-size:13px;padding:9px 11px}
 .user-name{font-size:13px}
 .logout{padding:8px 11px;font-size:13px}
 .wrap{padding:8px 12px 35px}
 .card{padding:22px 16px;border-radius:25px}
 .create{gap:12px}
 .magic{width:70px;height:70px;font-size:34px}
 h2{font-size:31px}
 .sub{font-size:18px}
 .tab{font-size:18px;padding:16px 7px}
 textarea{height:190px;font-size:18px;padding:20px}
 .grid2{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- LOGIN PAGE: NO GUEST OPTION -->
<section id="loginPage" class="login-page">
 <div class="login-card">
  <div class="big-logo">✦</div>
  <h1>Welcome to FlowAI</h1>
  <p>Login या Sign Up करें और<br>FlowAI Studio इस्तेमाल करें।</p>

  <div class="auth-tabs">
   <button type="button" id="loginTab" class="auth-tab active">Login</button>
   <button type="button" id="signupTab" class="auth-tab">Sign Up</button>
  </div>

  <input id="authName" class="auth-input" placeholder="Your name" autocomplete="name" style="display:none">
  <input id="authEmail" class="auth-input" type="email" placeholder="Email address" autocomplete="email">
  <input id="authPassword" class="auth-input" type="password" placeholder="Password" autocomplete="current-password">

  <button type="button" id="authButton" class="main-btn">Login</button>

  <div class="or">OR</div>

  <button type="button" id="googleButton" class="google-btn">🔵 Continue with Google</button>

  <div id="authMessage" class="auth-message"></div>
 </div>
</section>

<!-- STUDIO -->
<section id="studioPage" style="display:none">
<header class="top">
 <div class="brand">
  <div class="logo">✦</div>
  <div><h1>FlowAI</h1><p>Studio</p></div>
 </div>
 <div class="user-area">
  <span class="credits">⚡ <span id="credits">50</span> credits</span>
  <span class="user-name" id="userName">👤 User</span>
  <button type="button" class="logout" id="logoutButton">Logout</button>
 </div>
</header>

<main class="wrap">
<section class="card">
 <div class="create">
  <div class="magic">🪄</div>
  <div><h2>Create</h2><div class="sub">Describe your vision</div></div>
 </div>

 <div class="tabs">
  <button type="button" class="tab active" id="videoTab">🎞️ Video</button>
  <button type="button" class="tab" id="audioTab">♪ Audio</button>
 </div>

 <div class="label">PROMPT</div>
 <textarea id="prompt" maxlength="500" placeholder="A cinematic shot of..."></textarea>
 <div class="counter"><span id="count">0</span>/500</div>

 <div class="ideas">
  <button type="button" class="idea" data-idea="1">✦ Idea 1</button>
  <button type="button" class="idea" data-idea="2">✦ Idea 2</button>
  <button type="button" class="idea" data-idea="3">✦ Idea 3</button>
 </div>

 <div class="label">ASPECT RATIO</div>
 <div class="grid2">
  <button type="button" class="option selected" id="r169">
   <strong>▭ 16:9</strong><span>Landscape</span>
  </button>
  <button type="button" class="option" id="r916">
   <strong>▯ 9:16</strong><span>Portrait</span>
  </button>
 </div>

 <div class="label">DURATION</div>
 <div class="duration">
  <button type="button" id="d5">5s</button>
  <button type="button" id="d10" class="selected">10s</button>
  <button type="button" id="d15">15s</button>
 </div>

 <button type="button" id="generateButton" class="generate">⚡ Generate Video</button>
 <div id="status" class="status"></div>

 <div class="history">
  <h3>🕘 Recent Generations</h3>
  <div id="historyList"><div class="item">No generations yet</div></div>
 </div>
</section>
</main>
</section>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
"use strict";

const firebaseConfig = {
 apiKey:"AIzaSyBp_2OzwhX39EP6GIYpSR6WbFBqHNGKwqY",
 authDomain:"flowai-studio.firebaseapp.com",
 projectId:"flowai-studio",
 storageBucket:"flowai-studio.firebasestorage.app",
 messagingSenderId:"990645093332",
 appId:"1:990645093332:web:27b88ffc3ee92d8b248c41",
 measurementId:"G-X3Z5XL1QLK"
};

let auth = null;
let authMode = "login";
let mode = "Video";
let selectedRatio = "16:9";
let selectedDuration = 10;
let credits = 50;

function $(id){ return document.getElementById(id); }

function message(text, ok=false){
 const el=$("authMessage");
 el.textContent=text||"";
 el.style.color=ok ? "#8dffbd" : "#ff86a8";
}

function status(text){
 const el=$("status");
 el.style.display="block";
 el.innerHTML="";
 const span=document.createElement("span");
 span.textContent=text;
 el.appendChild(span);
}

function setAuthMode(type){
 authMode=type;
 const login=type==="login";
 $("loginTab").classList.toggle("active",login);
 $("signupTab").classList.toggle("active",!login);
 $("authName").style.display=login ? "none" : "block";
 $("authPassword").autocomplete=login ? "current-password" : "new-password";
 $("authButton").textContent=login ? "Login" : "Create Account";
 message("");
}

async function handleAuth(){
 const email=$("authEmail").value.trim();
 const password=$("authPassword").value;
 const name=$("authName").value.trim();

 message("");

 if(!email || !password){
  message("⚠️ Email और password डालें।");
  return;
 }
 if(authMode==="signup" && !name){
  message("⚠️ अपना नाम डालें।");
  return;
 }
 if(!auth){
  message("❌ Firebase load नहीं हुआ। Page refresh करके फिर कोशिश करें।");
  return;
 }

 const btn=$("authButton");
 btn.disabled=true;
 btn.textContent=authMode==="login" ? "Logging in..." : "Creating...";

 try{
  if(authMode==="login"){
   await auth.signInWithEmailAndPassword(email,password);
  }else{
   const result=await auth.createUserWithEmailAndPassword(email,password);
   await result.user.updateProfile({displayName:name});
  }
 }catch(error){
  console.error(error);
  const code=error && error.code ? error.code : "";
  const map={
   "auth/invalid-credential":"❌ Email या password गलत है।",
   "auth/wrong-password":"❌ Password गलत है।",
   "auth/user-not-found":"❌ यह email registered नहीं है। पहले Sign Up करें।",
   "auth/email-already-in-use":"❌ यह email पहले से registered है। Login करें।",
   "auth/weak-password":"❌ Password कम से कम 6 characters का होना चाहिए।",
   "auth/invalid-email":"❌ Email सही नहीं है।",
   "auth/too-many-requests":"❌ बहुत ज्यादा कोशिशें हुई हैं। थोड़ी देर बाद फिर करें।"
  };
  message(map[code] || ("❌ "+(error.message || "Login failed")));
 }finally{
  btn.disabled=false;
  btn.textContent=authMode==="login" ? "Login" : "Create Account";
 }
}

async function googleLogin(){
 if(!auth){
  message("❌ Firebase load नहीं हुआ।");
  return;
 }
 const btn=$("googleButton");
 btn.disabled=true;
 btn.textContent="Opening Google...";
 try{
  const provider=new firebase.auth.GoogleAuthProvider();
  await auth.signInWithRedirect(provider);
 }catch(error){
  console.error(error);
  message("❌ Google Login: "+(error.message||"Failed"));
  btn.disabled=false;
  btn.textContent="🔵 Continue with Google";
 }
}

function showStudio(user){
 $("loginPage").style.display="none";
 $("studioPage").style.display="block";
 const name=(user && (user.displayName || (user.email||"").split("@")[0])) || "User";
 $("userName").textContent="👤 "+name;
 loadCredits(user);
 loadHistory(user);
}

function showLogin(){
 $("loginPage").style.display="flex";
 $("studioPage").style.display="none";
}

function getUserKey(user){
 return user && user.uid ? "flowaiCredits_"+user.uid : "flowaiCredits_unknown";
}
function getHistoryKey(user){
 return user && user.uid ? "flowaiHistory_"+user.uid : "flowaiHistory_unknown";
}
function loadCredits(user){
 const key=getUserKey(user);
 let saved=localStorage.getItem(key);
 credits=saved===null ? 50 : parseInt(saved,10);
 if(!Number.isFinite(credits)) credits=50;
 localStorage.setItem(key,String(credits));
 $("credits").textContent=credits;
}
function saveCredits(user){
 localStorage.setItem(getUserKey(user),String(credits));
}

function loadHistory(user){
 const list=$("historyList");
 list.innerHTML="";
 let history=[];
 try{ history=JSON.parse(localStorage.getItem(getHistoryKey(user))||"[]"); }catch(e){}
 if(!Array.isArray(history)||!history.length){
  list.innerHTML='<div class="item">No generations yet</div>';
  return;
 }
 history.forEach(addHistoryItem);
}
function saveHistory(user,item){
 let history=[];
 try{history=JSON.parse(localStorage.getItem(getHistoryKey(user))||"[]")}catch(e){}
 if(!Array.isArray(history)) history=[];
 history.unshift(item);
 localStorage.setItem(getHistoryKey(user),JSON.stringify(history.slice(0,20)));
}
function addHistoryItem(item){
 const list=$("historyList");
 if(list.children.length===1 && list.children[0].textContent==="No generations yet") list.innerHTML="";
 const div=document.createElement("div");
 div.className="item";
 div.textContent="✨ "+item.mode+" • "+item.duration+"s • "+item.ratio+" — "+item.prompt;
 list.prepend(div);
}

function setMode(x){
 mode=x;
 $("videoTab").classList.toggle("active",x==="Video");
 $("audioTab").classList.toggle("active",x==="Audio");
 $("generateButton").textContent=x==="Video" ? "⚡ Generate Video" : "🎵 Generate Audio";
}
function setRatio(x){
 selectedRatio=x;
 $("r169").classList.toggle("selected",x==="16:9");
 $("r916").classList.toggle("selected",x==="9:16");
}
function setDuration(x){
 selectedDuration=x;
 [5,10,15].forEach(n=>$("d"+n).classList.toggle("selected",n===x));
}
function countText(){ $("count").textContent=$("prompt").value.length; }

const ideas=[
 "A cinematic drone shot over a futuristic city at sunset, ultra realistic, dramatic lighting",
 "A mysterious ancient temple hidden inside a beautiful jungle, cinematic atmosphere, realistic details",
 "A magical night sky above the mountains with glowing stars, epic cinematic scene, ultra realistic"
];

async function generate(){
 const prompt=$("prompt").value.trim();
 if(!prompt){status("⚠️ Please enter a prompt first.");return;}
 if(credits<=0){status("❌ Not enough credits.");return;}

 const btn=$("generateButton");
 btn.disabled=true;
 btn.textContent="⏳ Processing...";
 status("⏳ Your request is being processed...");

 try{
  const response=await fetch("/api/generate",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({prompt,mode,ratio:selectedRatio,duration:selectedDuration})
  });

  let data={};
  const text=await response.text();
  try{data=text ? JSON.parse(text) : {}}catch(e){data={error:text};}

  if(!response.ok) throw new Error(data.error || ("Server error "+response.status));

  const user=auth.currentUser;
  if(!user) throw new Error("Login session नहीं मिली।");

  credits--;
  $("credits").textContent=credits;
  saveCredits(user);

  const item={prompt,mode,ratio:selectedRatio,duration:selectedDuration};
  saveHistory(user,item);
  addHistoryItem(item);

  if(data.videoUrl){
   const statusEl=$("status");
   statusEl.innerHTML="";
   const title=document.createElement("div");
   title.textContent="✅ Video generated successfully!";
   statusEl.appendChild(title);
   const video=document.createElement("video");
   video.className="video-result";
   video.controls=true;
   video.playsInline=true;
   video.src=data.videoUrl;
   statusEl.appendChild(video);
  }else{
   status("✅ Request successfully submitted!");
  }
 }catch(error){
  console.error(error);
  status("❌ "+(error.message || "Something went wrong."));
 }finally{
  btn.disabled=false;
  btn.textContent=mode==="Video" ? "⚡ Generate Video" : "🎵 Generate Audio";
 }
}

async function logout(){
 try{
  if(auth) await auth.signOut();
 }catch(error){console.error(error);}
}

document.addEventListener("DOMContentLoaded",async function(){
 /* All buttons use addEventListener, so the page does not depend on inline onclick handlers. */
 $("loginTab").addEventListener("click",()=>setAuthMode("login"));
 $("signupTab").addEventListener("click",()=>setAuthMode("signup"));
 $("authButton").addEventListener("click",handleAuth);
 $("googleButton").addEventListener("click",googleLogin);
 $("logoutButton").addEventListener("click",logout);

 $("videoTab").addEventListener("click",()=>setMode("Video"));
 $("audioTab").addEventListener("click",()=>setMode("Audio"));
 $("prompt").addEventListener("input",countText);

 document.querySelectorAll(".idea").forEach(btn=>{
  btn.addEventListener("click",()=>{
   $("prompt").value=ideas[Number(btn.dataset.idea)-1]||"";
   countText();
  });
 });

 $("r169").addEventListener("click",()=>setRatio("16:9"));
 $("r916").addEventListener("click",()=>setRatio("9:16"));
 $("d5").addEventListener("click",()=>setDuration(5));
 $("d10").addEventListener("click",()=>setDuration(10));
 $("d15").addEventListener("click",()=>setDuration(15));
 $("generateButton").addEventListener("click",generate);

 try{
  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();

  try{
   await auth.getRedirectResult();
  }catch(error){
   console.error(error);
   message("❌ Google Login: "+(error.message||"Failed"));
  }

  auth.onAuthStateChanged(user=>{
   if(user) showStudio(user);
   else showLogin();
  });
 }catch(error){
  console.error(error);
  showLogin();
  message("❌ Firebase शुरू नहीं हुआ। Firebase config/check करें।");
 }
});
</script>
</body>
</html>
