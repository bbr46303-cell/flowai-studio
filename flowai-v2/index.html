<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FlowAI Studio</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 padding:0;
 min-height:100%;
}

body{
 font-family:Inter,Arial,sans-serif;
 color:#f7efff;
 background:
 radial-gradient(circle at 15% 0%,#6810ad 0,transparent 30%),
 radial-gradient(circle at 100% 30%,#360061 0,transparent 35%),
 #0b0714;
 min-height:100vh;
}

button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.6}

.login-page{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px;
}

.login-card{
 width:100%;
 max-width:500px;
 background:#100a1b;
 border:1px solid #8b36bd;
 border-radius:32px;
 padding:38px 25px;
 box-shadow:0 0 70px #8c20d955;
 text-align:center;
}

.big-logo{

 height:115px;
 margin:0 auto 24px;
 border-radius:32px;
 display:flex;
 align-items:center;

 box-shadow:0 0 45px #a626ff66;
}

.login-card h1{
 margin:0;
 font-size:40px;
}

.login-card p{

}

.auth-tabs{
 display:flex;
 background:#181321;
 padding:5px;
 border-radius:18px;
 margin-bottom:18px;
}

.auth-tab{
 flex:1;
 padding:15px;
 border:0;
 background:transparent;
 color:#9d94a7;
 border-radius:14px;
 font-weight:bold;
}

.auth-tab.active{

 background:linear-gradient(100deg,#7928dc,#d128d7);
}

.auth-input{
 display:block;
 width:100%;
 padding:17px;
 margin:8px 0;
 border-radius:15px;
 border:1px solid #3b2948;
 background:#0b0811;
 color:#fff;
 outline:none;
}

.auth-input:focus{

}

.main-btn{
 display:block;
 width:100%;
 padding:17px;
 border:0;
 border-radius:16px;
 margin-top:12px;
 color:#fff;
 font-weight:bold;
 background:linear-gradient(100deg,#7928dc,#d128d7);
 box-shadow:0 10px 30px #a127d944;
}

.google-btn{
 display:block;
 width:100%;
 padding:16px;
 border:0;
 border-radius:16px;
 margin-top:12px;
 background:#fff;
 color:#222;
 font-weight:bold;
}

.or{
 color:#777080;
 margin:18px 0;
}

.auth-message{
 min-height:25px;
 margin-top:15px;
 color:#ff86a8;
 font-size:15px;

}

/* STUDIO */

#studioPage{
 display:none;
}

.top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:24px 26px 18px;
 max-width:900px;
 margin:auto;
}

.brand{
 display:flex;
 align-items:center;
 gap:15px;
}

.logo{
 width:68px;
 height:68px;
 border-radius:21px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:36px;
 background:linear-gradient(135deg,#9b24ff,#d82be9);
 box-shadow:0 0 35px #a626ff66;
}

.brand h1{
 margin:0;
 font-size:30px;
}

.brand p{
 margin:3px 0;
 color:#c38cff;
 font-size:19px;
}

.user-area{

 gap:9px;

}

.credits{

}

.user-name{

 font-weight:bold;
}

.logout{

}

.wrap{

}

.card{

 background:#100b1bdb;
 padding:32px;

}

.create{

 align-items:center;
 gap:18px;
 margin-bottom:28px;
}

.magic{

 height:88px;
 border-radius:25px;
 display:flex;
 align-items:center;
 justify-content:center;

}

h2{

 margin:0;
}

.sub{

 font-size:22px;
 margin-top:4px;
}

.tabs{

 background:#171321;
 border-radius:23px;
 padding:6px;
 margin-bottom:32px;
}

.tab{
 flex:1;
 border:0;
 background:transparent;
 color:#aaa0b7;
 padding:18px;
 border-radius:18px;
 font-size:22px;

}

.tab.active{

 background:linear-gradient(100deg,#7829dc,#d027d4);
}

.label{
 color:#aaa0b8;
 font-weight:bold;
 letter-spacing:1px;
 font-size:17px;
 margin:22px 0 12px;
}

textarea{
 display:block;
 width:100%;
 height:210px;
 resize:none;
 background:#0d0915;
 color:#fff;
 border:1px solid #33253e;
 border-radius:24px;
 padding:23px;
 font-size:20px;
 outline:none;
}

textarea:focus{

}

.counter{
 text-align:right;
 color:#777080;
 margin-top:-34px;
 margin-right:18px;
}

.ideas{
 display:flex;
 gap:10px;
 margin:27px 0;
 flex-wrap:wrap;
}

.idea,.option{
 border:1px solid #33253f;
 background:#110d19;
 color:#d9d0df;
 border-radius:24px;
 padding:13px 20px;
 font-weight:bold;
}

.grid2{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:14px;
}

.option{
 text-align:left;
 padding:19px;
}

.option strong{
 display:block;
 font-size:22px;
 color:#eee;
}

.option span{
 color:#94899d;
 font-size:16px;
}

.option.selected{
 border-color:#c02cff;
 background:linear-gradient(135deg,#25123b,#17101f);
}

.duration{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:11px;
}

.duration button{
 border:1px solid #33253f;
 background:#110d19;
 color:#c8bfce;
 padding:17px;
 border-radius:17px;
 font-weight:bold;
}

.duration button.selected{
 background:linear-gradient(100deg,#7829dc,#c827d6);
 color:#fff;
 border-color:#c52aff;
}

.generate{
 width:100%;
 margin-top:28px;
 padding:19px;
 border:0;
 border-radius:21px;
 color:#fff;
 font-size:21px;
 font-weight:bold;
 background:linear-gradient(100deg,#7928dc,#d128d7);
}

.status{
 display:none;
 margin-top:18px;
 padding:17px;
 border-radius:17px;
 background:#181020;
 border:1px solid #432650;
 text-align:center;
 color:#d7c5e5;
 word-break:break-word;
}

.history{
 margin-top:25px;
}

.history h3{
 font-size:21px;
}

.item{
 padding:14px;
 border:1px solid #30203b;
 border-radius:15px;
 margin-top:9px;
 color:#a99faf;
 word-break:break-word;
}

@media(max-width:600px){

 .login-card{
  padding:30px 18px;
 }

 .big-logo{
  width:105px;
  height:105px;
  font-size:55px;
 }

 .login-card h1{
  font-size:33px;
 }

 .top{
  padding:17px;
  align-items:flex-start;
 }

 .brand h1{
  font-size:26px;
 }

 .brand p{
  font-size:17px;
 }

 .logo{
  width:58px;
  height:58px;
 }

 .credits{
  font-size:13px;
  padding:9px 11px;
 }

 .user-name{
  font-size:13px;
 }

 .logout{
  padding:8px 11px;
  font-size:12px;
 }

 .wrap{
  padding:8px 14px 35px;
 }

 .card{
  padding:21px 17px;
 }

 .magic{
  width:70px;
  height:70px;
  font-size:34px;
 }

 h2{
  font-size:30px;
 }

 .sub{
  font-size:17px;
 }

 .tab{
  font-size:17px;
  padding:15px 7px;
 }

 textarea{
  height:195px;
  font-size:18px;
 }

 .grid2{
  grid-template-columns:1fr;
 }
}
</style>

<!-- ================= FIREBASE ================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>


<script>

/* =====================================================
   FLOWAI
   ===================================================== */

const firebaseConfig = {
 apiKey:"AIzaSyBp_2OzwhX39EP6GIYpSR6WbFBqHNGKwqY",
 authDomain:"flowai-studio.firebaseapp.com",
 projectId:"flowai-studio",
 storageBucket:"flowai-studio.firebasestorage.app",
 messagingSenderId:"990645093332",
 appId:"1:990645093332:web:27b88ffc3ee92d8b248c41",
 measurementId:"G-X3Z5XL1QLK"
};


let auth = null;
let firebaseReady = false;

let authMode = "login";
let mode = "Video";
let selectedRatio = "16:9";
let selectedDuration = 10;
let credits = 50;
let currentUser = null;


/* ================= HELPER ================= */

function $(id){
 return document.getElementById(id);
}


function authMessage(text){

 $("authMessage").textContent =
  text || "";

}


function statusMessage(text){

 const box = $("status");

 box.style.display = "block";

 box.textContent =
  text;

}


/* =====================================================
   BUTTONS FIRST
   ===================================================== */

/* LOGIN / SIGNUP TAB */

$("loginTab").addEventListener(
 "click",
 function(){

  authMode = "login";

  $("loginTab")
   .classList.add("active");

  $("signupTab")
   .classList.remove("active");

  $("authName")
   .style.display = "none";

  $("authButton")
   .textContent = "Login";

  $("authPassword")
   .autocomplete =
   "current-password";

  authMessage("");

 }
);


$("signupTab").addEventListener(
 "click",
 function(){

  authMode = "signup";

  $("signupTab")
   .classList.add("active");

  $("loginTab")
   .classList.remove("active");

  $("authName")
   .style.display = "block";

  $("authButton")
   .textContent =
   "Create Account";

  $("authPassword")
   .autocomplete =
   "new-password";

  authMessage("");

 }
);


/* =====================================================
   EMAIL AUTH
   ===================================================== */

async function handleAuth(){

 authMessage("");

 if(!firebaseReady || !auth){

  authMessage(
   "❌ Firebase load नहीं हुआ। Page refresh करके फिर कोशिश करें।"
  );

  return;

 }


 const email =
  $("authEmail")
   .value
   .trim();

 const password =
  $("authPassword")
   .value;

 const name =
  $("authName")
   .value
   .trim();


 if(!email){

  authMessage(
   "⚠️ Email डालें।"
  );

  $("authEmail").focus();

  return;

 }


 if(!password){

  authMessage(
   "⚠️ Password डालें।"
  );

  $("authPassword").focus();

  return;

 }


 if(
  authMode === "signup" &&
  !name
 ){

  authMessage(
   "⚠️ अपना नाम डालें।"
  );

  $("authName").focus();

  return;

 }


 const button =
  $("authButton");

 button.disabled = true;

 button.textContent =
  authMode === "login"
   ? "⏳ Logging in..."
   : "⏳ Creating...";


 try{

  if(authMode === "login"){

   await auth.signInWithEmailAndPassword(
    email,
    password
   );

  }else{

   const result =
    await auth.createUserWithEmailAndPassword(
     email,
     password
    );

   await result.user.updateProfile({
    displayName:name
   });

   await result.user.reload();

  }


 }catch(error){

  console.error(
   "AUTH ERROR:",
   error
  );

  let msg =
   "❌ Login failed.";

  switch(error.code){

   case "auth/invalid-credential":
    msg =
     "❌ Email या password गलत है।";
    break;

   case "auth/user-not-found":
    msg =
     "❌ Account नहीं मिला। पहले Sign Up करें।";
    break;

   case "auth/wrong-password":
    msg =
     "❌ Password गलत है।";
    break;

   case "auth/email-already-in-use":
    msg =
     "❌ यह email पहले से registered है। Login करें।";
    break;

   case "auth/weak-password":
    msg =
     "❌ Password कम से कम 6 characters का होना चाहिए।";
    break;

   case "auth/invalid-email":
    msg =
     "❌ Email सही नहीं है।";
    break;

   case "auth/too-many-requests":
    msg =
     "❌ बहुत ज्यादा attempts हुए हैं। कुछ देर बाद कोशिश करें।";
    break;

   case "auth/network-request-failed":
    msg =
     "❌ Internet connection check करें।";
    break;

   case "auth/operation-not-allowed":
    msg =
     "❌ Firebase में Email/Password Login enable नहीं है।";
    break;

   default:
    msg =
     "❌ " +
     (
      error.message ||
      "Login failed."
     );

  }

  authMessage(msg);

 }finally{

  button.disabled = false;

  button.textContent =
   authMode === "login"
    ? "Login"
    : "Create Account";

 }

}


$("authButton").addEventListener(
 "click",
 handleAuth
);


/* ENTER */

$("authPassword").addEventListener(
 "keydown",
 function(event){

  if(event.key === "Enter"){
   handleAuth();
  }

 }
);


/* =====================================================
   GOOGLE
   ===================================================== */

async function googleLogin(){

 authMessage("");

 if(!firebaseReady || !auth){

  authMessage(
   "❌ Firebase load नहीं हुआ।"
  );

  return;

 }


 const button =
  $("googleButton");

 button.disabled = true;

 button.textContent =
  "⏳ Opening Google...";


 try{

  const provider =
   new firebase.auth.GoogleAuthProvider();

  provider.setCustomParameters({
   prompt:"select_account"
  });

  await auth.signInWithRedirect(
   provider
  );

 }catch(error){

  console.error(
   "GOOGLE ERROR:",
   error
  );

  authMessage(
   "❌ Google Login: " +
   (
    error.message ||
    "Failed"
   )
  );

  button.disabled = false;

  button.textContent =
   "🔵 Continue with Google";

 }

}


$("googleButton").addEventListener(
 "click",
 googleLogin
);


/* =====================================================
   FIREBASE INITIALIZE
   ===================================================== */

function initializeFirebase(){

 try{

  if(
   typeof firebase ===
   "undefined"
  ){

   throw new Error(
    "Firebase library load नहीं हुई।"
   );

  }


  if(
   !firebase.apps.length
  ){

   firebase.initializeApp(
    firebaseConfig
   );

  }


  auth =
   firebase.auth();

  firebaseReady = true;


  auth.setPersistence(
   firebase.auth.Auth.Persistence.LOCAL
  ).catch(function(error){

   console.error(
    "Persistence error:",
    error
   );

  });


  auth.onAuthStateChanged(
   function(user){

    if(user){

     currentUser = user;

     showStudio(user);

    }else{

     currentUser = null;

     showLogin();

    }

   }
  );


  auth.getRedirectResult()
   .catch(function(error){

    if(error){

     console.error(
      "Redirect error:",
      error
     );

     authMessage(
      "❌ Google Login: " +
      (
       error.message ||
       "Failed"
      )
     );

    }

   });


 }catch(error){

  console.error(
   "Firebase initialization error:",
   error
  );

  firebaseReady = false;

  authMessage(
   "❌ Firebase connection error. नीचे वाले Login को फिर try करें।"
  );

 }

}


/* =====================================================
   LOGIN / STUDIO
   ===================================================== */

function showLogin(){

 $("loginPage").style.display =
  "flex";

 $("studioPage").style.display =
  "none";

}


function showStudio(user){

 $("loginPage").style.display =
  "none";

 $("studioPage").style.display =
  "block";


 const displayName =
  user.displayName ||
  (
   user.email
    ? user.email.split("@")[0]
    : "User"
  );


 $("userName").textContent =
  "👤 " + displayName;


 loadCredits(user);

 loadHistory(user);

 window.scrollTo(
  0,
  0
 );

}


/* =====================================================
   LOGOUT
   ===================================================== */

async function logout(){

 if(!auth) return;

 try{

  await auth.signOut();

 }catch(error){

  console.error(error);

 }

}


$("logoutButton").addEventListener(
 "click",
 logout
);


/* =====================================================
   CREDITS
   ===================================================== */

function getUserKey(user){

 return "flowaiCredits_" +
  user.uid;

}


function loadCredits(user){

 if(!user) return;

 const key =
  getUserKey(user);

 const saved =
  localStorage.getItem(key);


 if(saved === null){

  credits = 50;

  localStorage.setItem(
   key,
   "50"
  );

 }else{

  credits =
   parseInt(
    saved,
    10
   );

  if(
   Number.isNaN(credits)
  ){

   credits = 50;

  }

 }


 $("credits").textContent =
  credits;

}


function saveCredits(user){

 if(!user) return;

 localStorage.setItem(
  getUserKey(user),
  String(credits)
 );

}


/* =====================================================
   MODE
   ===================================================== */

function setMode(x){

 mode = x;

 $("videoTab")
  .classList.toggle(
   "active",
   x === "Video"
  );

 $("audioTab")
  .classList.toggle(
   "active",
   x === "Audio"
  );

 $("generateButton")
  .textContent =
   x === "Video"
    ? "⚡ Generate Video"
    : "🎵 Generate Audio";

}


$("videoTab").addEventListener(
 "click",
 function(){
  setMode("Video");
 }
);
